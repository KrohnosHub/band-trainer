<style>
:root{
  --bg:#121416; --surface:#1b1e22; --surface2:#262a30; --border:#343a41;
  --fg:#ebe8e2; --muted:#9aa1a8; --accent:#e3a63c; --accent-fg:#1b1403;
  --danger:#e57563; --ok:#74c08f; --warn:#e3a63c;
  --radius:14px; --tap:48px; --fav:#f2c230;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f4f2ec; --surface:#ffffff; --surface2:#ebe8e0; --border:#d6d2c8;
  --fg:#1c1e21; --muted:#5f656c; --accent:#9a5f00; --accent-fg:#ffffff;
  --danger:#b3402f; --ok:#2f7d4c; --warn:#9a5f00; --fav:#d49a06;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent}
#app{max-width:980px;margin:0 auto;padding:0 14px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:1.35rem;margin:0;letter-spacing:.01em}
h2{font-size:1.05rem;margin:0 0 10px}
h3{font-size:.8rem;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
p{margin:0 0 10px}
a{color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:.86rem}
.hidden{display:none!important}

button,.btn{font:inherit;color:var(--fg);background:var(--surface2);border:1px solid var(--border);
  border-radius:12px;min-height:var(--tap);padding:0 16px;cursor:pointer;display:inline-flex;
  align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap;
  touch-action:manipulation;user-select:none}
button:active,.btn:active{transform:translateY(1px)}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}
button.primary,.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent;font-weight:650}
button.ghost{background:transparent}
button.danger{color:var(--danger)}
button.on{background:var(--accent);color:var(--accent-fg);border-color:transparent}
button.icon{padding:0;width:var(--tap)}
button:disabled{opacity:.45;cursor:not-allowed}
svg.i{width:22px;height:22px;fill:currentColor;flex:none}

input[type=text],input[type=search],input[type=url],input[type=number],select,textarea{
  font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--border);border-radius:12px;
  min-height:var(--tap);padding:10px 12px;width:100%}
textarea{min-height:120px;resize:vertical;line-height:1.4}
textarea.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.95rem}
input[type=range]{width:100%;accent-color:var(--accent);height:32px;margin:0}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:.84rem;color:var(--muted);margin-bottom:4px}
label.chk{display:inline-flex;align-items:center;gap:8px;min-height:var(--tap);cursor:pointer}

.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 10px;
  display:flex;align-items:center;gap:10px}
.top .grow{flex:1;min-width:0}
.top .sub{color:var(--muted);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.nowrap{flex-wrap:nowrap}
.grow{flex:1;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border-radius:999px;min-height:40px;padding:0 14px;font-size:.92rem}
.badge{display:inline-block;font-size:.74rem;padding:2px 8px;border-radius:999px;border:1px solid var(--border);
  color:var(--muted);white-space:nowrap;vertical-align:middle}
.badge.setlist{color:var(--ok);border-color:var(--ok)}
.badge.todo{color:var(--muted)}
.badge.warn{color:var(--warn);border-color:var(--warn)}

.songs{list-style:none;margin:0;padding:0}
.song{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;min-height:64px;height:auto;white-space:normal}
.song .t{font-weight:650;font-size:1.03rem}
.song .a{color:var(--muted);font-size:.92rem}
.song .m{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.song .l{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;width:100%}
.song>div{width:100%}
.empty{text-align:center;color:var(--muted);padding:36px 10px}

.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:4px;margin-bottom:12px;position:sticky;top:var(--hh,64px);z-index:4;box-shadow:0 6px 10px -8px rgba(0,0,0,.5)}
.tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:0 6px;min-width:0}
.tabs button.on{background:var(--accent);color:var(--accent-fg);font-weight:650}

.chordview{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:calc(.8rem * var(--cs,1));line-height:1.25}   /* v1.8.2: Tablet/Desktop Standard = früher 2× A− (×0,7) */
.chordview .sect{font-family:system-ui,sans-serif;font-size:.6em;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 6px}
.chordview .sect:first-child{margin-top:0}
.chordview .flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:6px;flex:1;min-width:0}
.chordview .fc{background:var(--surface2);border-radius:10px;padding:.45em .6em;font-weight:650}
.chordview .sep{color:var(--muted)}
.chordview .cnote{font-family:system-ui,sans-serif;font-size:.62em;color:var(--muted);margin:2px 0 6px}
.chordview .bars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.chordview .bar{background:var(--surface2);border-radius:10px;padding:.55em .3em;text-align:center;font-weight:650;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#abcOut{background:#fff;color:#111;border-radius:10px;padding:6px;min-height:60px;overflow:hidden}
:root:not([data-theme="light"]) #abcOut{background:#e9e6df}
#abcWarn{color:var(--warn);font-size:.86rem;margin-top:6px;white-space:pre-wrap}
details.help{margin-top:10px}
details>summary{cursor:pointer;min-height:var(--tap);display:flex;align-items:center;color:var(--accent);font-weight:600}
pre{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px;overflow:auto;font-size:.86rem;margin:6px 0 10px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
table.kv{border-collapse:collapse;width:100%;font-size:.9rem}
table.kv td{padding:4px 8px 4px 0;vertical-align:top;border-bottom:1px solid var(--border)}
table.kv td:first-child{white-space:nowrap;font-family:ui-monospace,Menlo,Consolas,monospace}

.stem{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;padding:12px 0;border-top:1px solid var(--border)}
.stem:first-of-type{border-top:0;padding-top:0}
.stem .fn{font-size:.88rem;color:var(--muted);overflow-wrap:anywhere}
.stem .ctl{grid-column:1/-1;display:flex;gap:8px;align-items:center}
.stem input[type=file]{display:none}

.yt{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;margin:10px 0}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.link{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--border)}
.link:first-child{border-top:0}
.link .grow div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.searchgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.searchgrid .btn{justify-content:flex-start;white-space:normal;text-align:left;padding:8px 14px}

.transport{position:sticky;bottom:0;z-index:6;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius) var(--radius) 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  margin:16px -6px 0;box-shadow:0 -8px 24px rgba(0,0,0,.25)}
.transport .seekrow{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;font-size:.9rem}
.transport .seekrow span{min-width:38px;text-align:center}
.transport .btnrow{display:flex;gap:6px;align-items:center;margin-top:6px}
.transport .btnrow button{flex:1;padding:0 4px;min-width:0;font-size:.9rem}
.transport .btnrow #bMore{flex:1.5}
.transport .btnrow .play{flex:1.4;min-height:56px}
.transport .temporow{display:flex;gap:10px;align-items:center;margin-top:6px;font-size:.9rem}
.transport .temporow .lab{white-space:nowrap;flex:none;min-width:150px;font-variant-numeric:tabular-nums}
.transport .extra{display:none}
.transport.open .extra{display:block}
.loopinfo{font-size:.8rem;color:var(--muted);text-align:center;margin-top:4px;min-height:1.1em}

.fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));
  border-radius:999px;min-height:56px;padding:0 22px;box-shadow:0 6px 20px rgba(0,0,0,.35);z-index:7}
dialog{background:var(--surface);color:var(--fg);border:1px solid var(--border);border-radius:18px;
  padding:18px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.92rem;z-index:20;
  max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.notice{border-left:3px solid var(--warn);padding:8px 12px;background:var(--surface2);border-radius:0 10px 10px 0;margin-bottom:12px;font-size:.92rem}

@media (min-width:760px){
  .chordview{font-size:calc(.98rem * var(--cs,1))}
  .transport .rows{display:grid;grid-template-columns:1.2fr 1fr;gap:0 18px;align-items:center}
  .transport .extra{display:block}
  #bMore{display:none}
}
/* Handy: kompakter (v1.2.1) */

  :root{--tap:40px;--radius:12px}
  body{font-size:14.5px}
  #app{padding:0 10px calc(20px + env(safe-area-inset-bottom))}
  h1{font-size:1.12rem} .top{padding:calc(6px + env(safe-area-inset-top)) 0 6px;gap:6px} .top .sub{font-size:.8rem}
  button,.btn{padding:0 11px;border-radius:10px} button.icon{width:var(--tap)} svg.i{width:19px;height:19px}
  .addtop{min-height:32px;padding:0 10px}
  .chips{gap:6px;padding:6px 0} .chip{min-height:32px;padding:0 11px;font-size:.84rem}
  .card{padding:10px;margin-bottom:9px}

  .badge{font-size:.68rem;padding:1px 6px}
  .tabs{padding:3px;margin-bottom:9px} .tabs button{font-size:.84rem;min-height:34px;padding:0 4px}
  input[type=text],input[type=search],input[type=url],input[type=number],select,textarea{padding:7px 10px}

/* Audiodateien (Stems), Notenblätter und deren Freihand-Notizen in IndexedDB (ein gemeinsamer Speicher, Schlüssel mit Präfix). */
const IDB = {
  _db:null,
  open() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('bandtrainer', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('stems');
      r.onsuccess = () => { this._db = r.result; res(this._db); };
      r.onerror = () => rej(r.error);
    });
  },
  async _req(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction('stems', mode); const rq = fn(tx.objectStore('stems'));
      tx.oncomplete = () => res(rq && rq.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  },
  get(key) { return this._req('readonly', s => s.get(key)); },
  put(key, val) { return this._req('readwrite', s => s.put(val, key)); },
  del(key) { return this._req('readwrite', s => s.delete(key)); }
};
const stemKey = (songId, slot) => songId + ':' + slot;
const sheetKey = (songId, id) => 'nb|' + songId + '|' + id;   // Notenblatt-Datei {blob,name,type,size,u}
const annKey = (songId, id) => 'na|' + songId + '|' + id;     // Freihand-Notizen {data:{v,pages},u}

  hadLogin() { return !!LS.get('hadlogin') || (!LS.get('signedOut') && !!(this.gapp('hadlogin') || this.gapp('folderId'))); },

  /* --- Drive-Zugriff --- */

  // Ordner «Band-Trainer»: gemerkte ID prüfen (gilt auch nach dem Verschieben in Drive), sonst per Name suchen, sonst anlegen.
  async ensureFolder(interactive = false) {

        const info = await (await this.fetch(`${DRIVE_FILES}/${this.folderId}?fields=id,trashed`, {}, interactive)).json();
        if (info && !info.trashed) return this.folderId;

    const data = await (await this.fetch(`${DRIVE_FILES}?q=${q}&fields=files(id,name)`, {}, interactive)).json();
    if (data.files && data.files.length) this.folderId = data.files[0].id;

  async childFolder(name, key, interactive = false) {

      catch (e) { if (e.message === 'unauthorized' || e.message === 'offline') throw e; }
      LS.del(key);
    }
    const q = encodeURIComponent(`'${this.folderId}' in parents and trashed=false and name='${escQ(name)}' and mimeType='${FOLDER_MIME}'`);
    const found = (await (await this.fetch(`${DRIVE_FILES}?q=${q}&fields=files(id)`, {}, interactive)).json()).files || [];
    let id = found.length ? found[0].id : null;
    if (!id) id = (await (await this.fetch(`${DRIVE_FILES}?fields=id`, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ name, mimeType:FOLDER_MIME, parents:[this.folderId] }) }, interactive)).json()).id;
    LS.set(key, id); return id;
  },
  async findByName(name, parent) {

    const data = await (await this.fetch(`${DRIVE_FILES}?q=${q}&fields=files(id,name,modifiedTime)`)).json();

  async readJson(id) { return (await this.fetch(`${DRIVE_FILES}/${id}?alt=media`)).json(); },
  async uploadJson(name, obj, existingId, parentId) {

        const init = await this.fetch(`${DRIVE_UPLOAD}?uploadType=resumable&fields=id`, { method:'POST', headers:{ 'Content-Type':'application/json; charset=UTF-8', 'X-Upload-Content-Type':type, 'X-Upload-Content-Length':String(blob.size) }, body:JSON.stringify(meta) }, interactive);

  /* --- Abgleich --- */
  markDirty() {   // lokale Änderung merken; kurz darauf mit Drive abgleichen (oder später, sobald online/angemeldet)

  },
  enqueue(fn) { const p = this.chain.then(fn, fn); this.chain = p.catch(() => {}); return p; },
  async syncAll(force) {

    this.lastRun = Date.now(); clearTimeout(this.timer);
    return this.enqueue(async () => {
      this.syncing++; UI.sync();
      try {
        await this.ensureFolder(false);
        await this.syncLibrary();
        if (await this.syncSheets()) await this.syncLibrary();   // neue Drive-Kennungen der Blätter gleich mit in library.json
        await this.flushTrash();
        await this.autoBackup().catch(e => console.warn('Sicherung', e));
        this.lastError = ''; LS.set('lastSync', Date.now()); return true;
      } catch (e) {

  },
  async syncLibrary() {

    if (fid) { try { remote = await this.readJson(fid); } catch (e) { if (e.status !== 404) throw e; fid = null; LS.del('libId'); } }
    if (!fid) { const f = await this.findByName('library.json', this.folderId); if (f) { fid = f.id; remote = await this.readJson(fid); } }
    if (fid && (!remote || !Array.isArray(remote.songs))) throw new Error('library.json in Drive ist nicht lesbar. Datei in Drive prüfen oder löschen – der lokale Stand wird dann neu hochgeladen.');
    // Ab hier bis Store.apply ohne «await»: zwischen Lesen und Übernehmen kann keine Eingabe verloren gehen.
    const local = Store.snapshot(), rem = remote ? cleanData(remote) : null;
    const merged = rem ? mergeData(local, rem) : local, mStr = canonData(merged);
    if (mStr !== canonData(local)) { Store.apply(merged); App.refresh(); }
    if (!rem || mStr !== canonData(rem)) { const out = await this.uploadJson('library.json', Store.payload(), fid, this.folderId); if (out && out.id) LS.set('libId', out.id); }

  async listBackups() {

    const q = encodeURIComponent(`'${bid}' in parents and trashed=false and name contains 'library-'`);
    const files = (await (await this.fetch(`${DRIVE_FILES}?q=${q}&pageSize=200&fields=files(id,name,modifiedTime,size)`)).json()).files || [];

  async autoBackup(force) {

    const bid = await this.childFolder('Backups', 'backupFolder'), name = `library-${day}.json`;

  queueTrash(id) { if (!id) return; let a = []; try { a = JSON.parse(LS.get('trash') || '[]'); } catch (e) {} a.push(id); LS.set('trash', JSON.stringify(a.slice(-200))); },

/* ---------- YouTube & Suchlinks ---------- */
function ytId(url) {
  try {
    const u = new URL(String(url).trim()); const h = u.hostname.replace(/^(www|m|music)\./, ''); let id = null;
    if (h === 'youtu.be') id = u.pathname.split('/')[1];
    else if (h === 'youtube.com' || h === 'youtube-nocookie.com') {
      id = u.searchParams.get('v'); const m = u.pathname.match(/^\/(embed|shorts|live)\/([^/?]+)/); if (!id && m) id = m[2];
    }
    return id && /^[\w-]{11}$/.test(id) ? id : null;
  } catch { return null; }
}
// Ab v1.2.2 über youtube.com statt youtube-nocookie.com: nur so gilt die Anmeldung im Browser (YouTube Premium = keine Werbung).
// Blockiert der Browser Drittanbieter-Cookies (z. B. Safari), kennt die Einbettung das Konto nicht → Link «In YouTube öffnen» (App, werbefrei mit Premium).
const ytEmbed = id => '<div class="yt"><iframe src="https://www.youtube.com/embed/' + id + '?playsinline=1&rel=0" title="YouTube-Video" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen"></iframe></div>'
  + '<div class="row small" style="margin:-4px 0 8px"><a class="btn" href="https://www.youtube.com/watch?v=' + id + '" target="_blank" rel="noopener noreferrer">In YouTube öffnen</a><span class="muted grow">Werbung trotz Premium? Dann blockiert der Browser die Anmeldung in der Einbettung – in YouTube öffnen.</span></div>';
/* Quellen für Akkorde und Noten: generierte SUCH-Links. Für Hooktheory, Musicnotes und Sheet Music Direct bewusst eine
   Google-Suche mit «site:» – deren eigene Such-Adressen sind nicht verlässlich dokumentiert, die Google-Form funktioniert immer. */
function sourceLinks(song) {
  const q = (song.title + ' ' + song.artist).trim(), e = encodeURIComponent;
  const g = site => 'https://www.google.com/search?q=' + e('site:' + site + ' ' + q);
  return [
    ['Hooktheory TheoryTab: Akkorde und Analyse', g('hooktheory.com/theorytab')],
    ['Musicnotes: offizielle Noten (kostenpflichtig)', g('musicnotes.com')],
    ['Sheet Music Direct: offizielle Noten (kostenpflichtig)', g('sheetmusicdirect.com')],
    ['Ultimate Guitar: Akkorde', 'https://www.ultimate-guitar.com/search.php?search_type=title&value=' + e(q)]
  ];
}
function searchLinks(song) {   // generierte SUCH-Links – keine fest hinterlegten Videos
  const q = (song.title + ' ' + song.artist).trim(), e = encodeURIComponent;
  const yt = s => 'https://www.youtube.com/results?search_query=' + e(q + ' ' + s);
  return [
    ['YouTube: Keyboard-Tutorial', yt('keyboard tutorial')],
    ['YouTube: Piano-Akkorde', yt('piano chords tutorial')],
    ['YouTube: Bass-Tutorial', yt('bass tutorial')],
    ['YouTube: Bass-Cover', yt('bass cover')],
    ['YouTube: isolierter Bass', yt('isolated bass')],
    ...sourceLinks(song),
    ['Songsterr: Bass-Tabs', 'https://www.songsterr.com/?pattern=' + e(q)]
  ];
}

/* ---------- Guide-Videos: Vorschläge über die YouTube Data API v3 ----------
   Es werden ausschliesslich echte API-Treffer angezeigt (nichts fest hinterlegt). Ohne Schlüssel/Netz bleiben die Suchlinks. */
function decodeHtml(t) { const x = document.createElement('textarea'); x.innerHTML = String(t == null ? '' : t); return x.value; }
const Suggest = {
  busy:new Set(), err:{},
  available() { return !!CONFIG.YOUTUBE_API_KEY; },
  async search(query) {
    const url = 'https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&maxResults=8&q=' + encodeURIComponent(query) + '&key=' + encodeURIComponent(CONFIG.YOUTUBE_API_KEY);
    let res;
    try { res = await fetch(url); } catch (e) { throw new Error('YouTube nicht erreichbar (offline?)'); }
    if (!res.ok) { const t = await res.text().catch(() => ''); throw new Error(res.status === 403 ? 'YouTube-Suche abgelehnt (Tageskontingent aufgebraucht oder Schlüssel für diese Adresse nicht freigegeben).' : 'YouTube-Fehler ' + res.status + (/"message"/.test(t) ? '' : ' ' + t.slice(0, 120))); }
    const data = await res.json();
    return (data.items || []).filter(it => it && it.id && /^[\w-]{11}$/.test(it.id.videoId || '') && it.snippet).map(it => {
      const th = it.snippet.thumbnails || {}, thumb = (th.medium || th.default || {}).url || '';
      return { vid:it.id.videoId, title:decodeHtml(it.snippet.title), channel:decodeHtml(it.snippet.channelTitle), thumb:/^https:\/\/i\.ytimg\.com\//.test(thumb) ? thumb : '' };
    });
  },
  // Je die besten 3 Treffer für Keyboard und Bass; bereits übernommene oder verworfene Videos werden übersprungen.
  async run(song, force) {
    if (!this.available() || song.isDemo || this.busy.has(song.id)) return;
    if (!force && song.suggest && song.suggest.at) return;
    if (!isOnline()) { if (force) toast('Offline – Vorschläge gibt es erst mit Internet.'); return; }
    this.busy.add(song.id); delete this.err[song.id]; UI.suggest();
    try {
      const base = (song.title + ' ' + song.artist).trim(), prev = song.suggest || {};
      const taken = new Set([...(prev.dismissed || []), ...song.links.map(l => ytId(l.url)).filter(Boolean)]);
      const pick = (arr, kind, out) => { for (const v of arr) { if (out.length >= 3) break; if (taken.has(v.vid)) continue; taken.add(v.vid); out.push(Object.assign({ kind }, v)); } };
      const keys = [], bass = [];
      pick(await this.search(base + ' keyboard tutorial'), 'keys', keys);
      pick(await this.search(base + ' bass tutorial'), 'bass', bass);
      if (bass.length < 3) pick(await this.search(base + ' bass cover'), 'bass', bass);
      song.suggest = { at:Date.now(), items:[...keys, ...bass], dismissed:prev.dismissed || [] };
      Store.touch(song);
    } catch (e) { this.err[song.id] = e.message; }

  accept(song, vid) {
    const it = song.suggest && song.suggest.items.find(x => x.vid === vid); if (!it) return;
    song.links.push({ id:uid(), label:it.title || LINK_KINDS[it.kind], url:'https://www.youtube.com/watch?v=' + it.vid, kind:it.kind });
    song.suggest.items = song.suggest.items.filter(x => x.vid !== vid); Store.touch(song);
  },
  dismiss(song, vid) {
    if (!song.suggest) return;
    song.suggest.items = song.suggest.items.filter(x => x.vid !== vid);

    Store.touch(song);

/* ---------- Google-Dateiauswahl (v1.6.0): Dateien aus deiner Drive-Ablage übernehmen ----------
   Mit dem Scope drive.file sieht die App nur eigene Dateien – über die Google-Auswahl gibst du ihr ausgewählte Dateien frei.
   Benötigt im Cloud-Projekt die freigeschaltete «Google Picker API» für den Browser-Schlüssel (CONFIG.PICKER_API_KEY). */
const Picker = {
  loading:null,
  load() {
    if (window.google && google.picker) return Promise.resolve(true);

      const go = () => window.gapi.load('picker', { callback:() => res(true), onerror:() => res(false), timeout:15000, ontimeout:() => res(false) });

  async pick({ kind, multi }) {
    if (!Cloud.hadLogin()) { toast('Zuerst mit Google Drive verbinden (Menü ⋯).'); return []; }
    if (!isOnline()) { toast('Offline – die Dateiauswahl braucht Internet.'); return []; }
    if (!Cloud.tokenValid()) { const ok = await Cloud.signIn(); if (!ok) return []; }
    if (!(await this.load())) { toast('Google-Dateiauswahl nicht erreichbar.'); return []; }

        const view = new P.DocsView(P.ViewId.DOCS).setIncludeFolders(true).setSelectFolderEnabled(false)

          .setParent(audio ? CONFIG.PICK_AUDIO_FOLDER : CONFIG.PICK_SHEET_FOLDER);
        const b = new P.PickerBuilder().addView(view).setOAuthToken(Cloud.token).setDeveloperKey(CONFIG.PICKER_API_KEY || CONFIG.YOUTUBE_API_KEY).setAppId(CONFIG.PICKER_APP_ID)
          .setOrigin(location.protocol + '//' + location.host).setLocale('de').setTitle(audio ? 'Audiodatei aus Drive wählen' : 'Notenblätter aus Drive wählen')
          .setCallback(d => { if (d.action === P.Action.PICKED) resolve((d.docs || []).map(x => ({ id:x.id, name:x.name, mimeType:x.mimeType, size:Number(x.sizeBytes) || 0 }))); else if (d.action === P.Action.CANCEL) resolve([]); });
        if (multi) b.enableFeature(P.Feature.MULTISELECT_ENABLED);

/* ---------- Spotify: Titel pro Song automatisch verknüpfen (ab v1.2.0) ----------
   Client-Credentials-Token (kein Nutzer-Login), Suche nach Titel + Interpret. Verknüpft wird nur, wenn Interpret UND Titel

      try { await Sheets.add(song, f, kind, label ? (files.length > 1 ? label + ' ' + (i + 1) : label) : ''); n++; }
      catch (e) { console.warn(e); toast(e.message || 'Datei konnte nicht gespeichert werden.'); }
    }
    if (n) { if ($('#shLabel')) $('#shLabel').value = ''; UI.sheets(); toast(n === 1 ? 'Blatt gespeichert.' : n + ' Blätter gespeichert.'); }
  },
  async addStem(song, slot, file) {
    if (!file) return;
    if (!/^audio\//.test(file.type) && !/\.(mp3|m4a|aac|wav|flac|ogg|opus)$/i.test(file.name)) { toast('Bitte eine Audiodatei wählen.'); return; }
    try {
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
      const rec = { blob:file, name:file.name, type:file.type, size:file.size, u:Date.now() };
      await IDB.put(stemKey(song.id, slot), rec);
      const old = song.stems[slot]; if (old && old.driveId) Cloud.queueTrash(old.driveId);   // ersetzte Datei: alte Drive-Kopie entfernen
      song.stems[slot] = { name:file.name, size:file.size, type:file.type || '', u:rec.u }; song.mix[slot].on = true; Store.touch(song);
      const wasPlaying = Player.playing; if (wasPlaying) Player.pause();
      Player.attach(slot, rec); UI.stems(); UI.transport(); toast('Gespeichert: ' + file.name);
    } catch (e) { console.error(e); toast('Datei konnte nicht gespeichert werden (Speicherplatz?).'); }
  }
};

      <p class="small muted">Export enthält Songs, Akkorde, Basslines, Links und Notizen – keine Audiodateien und keine Notenblätter. Import führt zusammen: bei gleichem Song gewinnt der neuere Stand. «Akkorde importieren» liest eine Datei <code>{"songs":[{"title","artist","key","chords","chordSource","chordStatus"}]}</code>, ordnet sie über Titel und Interpret den vorhandenen Songs zu und zeigt vor dem Übernehmen eine Vorschau.</p>
      <h3 style="margin-top:14px">Spotify</h3>
      <p class="small muted">Für die automatische Spotify-Verknüpfung. ${Spotify.available() ? 'Zugangsdaten vorhanden' + (LS.get('sp_secret') ? ' (hier gespeichert).' : ' (aus der Gesangs-App übernommen).') : 'Keine Zugangsdaten auf diesem Gerät.'} Werden nur lokal in diesem Browser gespeichert – nicht im Code, nicht in Drive. Anlegen unter developer.spotify.com → Dashboard → App.</p>
      <div class="grid2"><label class="f"><span>Client-ID</span><input type="text" id="spIdIn" autocomplete="off" value="${esc(LS.get('sp_id') || '')}" placeholder="leer = Standard"></label>
        <label class="f"><span>Client-Secret</span><input type="text" id="spSecIn" class="masked" name="bt-sp-secret" autocomplete="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore" value="${esc(LS.get('sp_secret') || '')}" placeholder="${Spotify.available() && !LS.get('sp_secret') ? 'aus Gesangs-App' : ''}"></label></div>
      <div class="row" style="margin-bottom:8px"><button data-act="spSave">Spotify-Zugangsdaten speichern</button></div>
      <h3 style="margin-top:14px">Hinweise</h3>
      <p class="small muted">Keine Songtexte oder vollständigen Transkriptionen Dritter veröffentlichen. Eigene Notizen für den Proberaum sind in Ordnung; Audiodateien bleiben auf dem Gerät bzw. in deinem privaten Drive.</p>
      <p class="small muted" id="verLine">Version ${APP_VERSION} · abcjs ${ABCJS_VERSION} · pdf.js ${PDFJS_VERSION} · Offline-Speicher ${sw}${usage ? ' · ' + usage : ''}</p>
      <p class="small muted">Läuft auf ${esc(location.origin)} · Client-ID ${esc(id.length > 24 ? id.slice(0, 12) + '…' + id.slice(-27) : id)}</p>
      <div class="actions"><button data-act="reload">Neu laden / Update suchen</button><button data-act="close" class="primary">Schliessen</button></div>`;
    if (!d.open) d.showModal();
  },
  folderHint() {
    const d = $('#dlg');
    d.innerHTML = `<h2>Ordner in Google Drive</h2>
      <p>Die App hat in deinem Drive den Ordner <b>«${esc(CONFIG.FOLDER_NAME)}»</b> eingerichtet. Darin liegen <code>library.json</code> (Songs und Einstellungen) sowie die Unterordner «Stems», «Backups» (tägliche Sicherung, die letzten ${BK_KEEP} bleiben) und – sobald du Notenblätter ablegst – «Notenblätter».</p>
      <p>Du darfst den Ordner in Drive verschieben, zum Beispiel nach <b>«04_Band»</b> – die App findet ihn weiterhin, weil sie ihn selbst erstellt hat und sich seine Kennung nicht ändert. Bitte nicht umbenennen und die Dateien darin nicht von Hand bearbeiten.</p>
      <div class="actions"><button data-act="close" class="primary">Verstanden</button></div>`;
    if (!d.open) d.showModal();
  },
  async backups() {
    const d = $('#dlg');
    d.innerHTML = '<h2>Sicherungen in Drive</h2><p class="small muted" id="bkState">Lade Liste …</p><div class="scroll" id="bkList"></div><div class="actions"><button data-act="menu">Zurück</button><button data-act="close" class="primary">Schliessen</button></div>';
    try {
      const list = await Cloud.listBackups();
      if (!$('#bkList')) return;
      $('#bkState').textContent = list.length ? 'Wiederherstellen holt den Stand der Sicherung zurück (auch Gelöschtes). Songs, die es nur jetzt gibt, bleiben erhalten.' : 'Noch keine Sicherung vorhanden.';
      $('#bkList').innerHTML = list.map(f => `<div class="link"><div class="grow"><b>${esc(f.name.slice(8, 18).split('-').reverse().join('.'))}</b></div><button data-act="restore" data-id="${esc(f.id)}" data-name="${esc(f.name)}">Wiederherstellen</button></div>`).join('');
    } catch (e) { if ($('#bkState')) $('#bkState').textContent = 'Sicherungen nicht erreichbar: ' + explainError(e); }
  }
};

/* ---------- Import / Export / Wiederherstellen ---------- */
const IO = {
  exportJson() {
    const a = document.createElement('a'); const url = URL.createObjectURL(new Blob([JSON.stringify(Object.assign({ exportedAt:new Date().toISOString() }, Store.payload()), null, 2)], { type:'application/json' }));
    a.href = url; a.download = 'band-trainer-' + new Date().toISOString().slice(0, 10) + '.json'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000); toast('Export erstellt.');
  },
  merge(inc) {   // eingehenden Stand zusammenführen; gibt zurück, wie viele Songs neu/aktualisiert sind
    const before = new Map(Store.data.songs.map(s => [s.id, s.updatedAt || 0]));
    Store.apply(mergeData(Store.snapshot(), inc)); Store.fixOrder(true); Store.save();
    let added = 0, updated = 0;
    for (const s of Store.data.songs) { if (!before.has(s.id)) added++; else if ((s.updatedAt || 0) > before.get(s.id)) updated++; }
    return { added, updated };
  },
  async importJson(file) {
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!data || !Array.isArray(data.songs)) throw new Error('Keine Songliste gefunden.');
      // Akkord-Datei (Einträge ohne ID, aber mit Akkorden/Tonart) im falschen Menüpunkt gewählt → zur Akkord-Vorschau
      if (data.app !== 'band-trainer' && data.songs.length && !data.songs.some(x => x && typeof x.id === 'string')) { Dialogs.chordImport(this.chordPlan(data)); return; }
      const inc = cleanData(data); inc.settingsAt = 0;   // Einstellungen dieses Geräts bleiben
      const r = this.merge(inc);
      $('#dlg').close(); App.route(); toast('Import: ' + r.added + ' neu, ' + r.updated + ' aktualisiert.');
    } catch (e) { toast('Import fehlgeschlagen: ' + e.message); }
  },
  /* Akkord-Import: Datei {songs:[{title, artist, key, chords, chordSource, chordStatus}]} den vorhandenen Songs zuordnen.
     Zuordnung über Titel + Interpret (unscharf, siehe normName/artistMatch). Gibt die Vorschau-Zeilen zurück; geändert wird noch nichts. */
  chordPlan(data) {
    if (!data || !Array.isArray(data.songs)) throw new Error('Keine Songliste gefunden (erwartet: {"songs":[…]}).');
    const str = (v, max) => typeof v === 'string' ? v.slice(0, max).trim() : '';
    const songs = Store.data.songs.filter(s => !s.isDemo);
    return data.songs.slice(0, 500).filter(e => e && typeof e === 'object' && typeof e.title === 'string' && e.title.trim()).map(e => {
      const title = str(e.title, 300), artist = str(e.artist, 300), tk = normName(title);
      const cand = tk ? songs.filter(s => normName(s.title) === tk) : [], strong = cand.filter(s => artistMatch(s.artist, artist) !== false);
      let song = null, how = 'none';
      if (strong.length === 1) { song = strong[0]; how = 'exact'; }
      else if (strong.length > 1 || cand.length > 1) how = 'multi';
      else if (cand.length === 1) { song = cand[0]; how = 'title'; }
      const f = {}, key = str(e.key, 20), src = typeof e.chordSource === 'string' && e.chordSource.length <= 1000 ? safeUrl(e.chordSource) : null;
      const chords = (Array.isArray(e.chords) ? e.chords.filter(x => typeof x === 'string').join('\n') : typeof e.chords === 'string' ? e.chords : '').replace(/\r\n?/g, '\n').slice(0, 20000).trim();
      if (key) f.key = key;
      if (chords) f.chords = chords;
      if (src) f.chordSource = src;
      if (e.chordStatus != null && e.chordStatus !== '') f.chordStatus = e.chordStatus === true || /^(checked|gepr(ü|ue)ft|verified|ok)$/i.test(String(e.chordStatus).trim()) ? 'checked' : 'unchecked';
      else if (chords) f.chordStatus = 'unchecked';   // neue Akkorde ohne Angabe gelten als ungeprüft
      const changes = []; let replaces = false;
      if (song) {
        if (f.key && f.key !== song.key) changes.push('Tonart: ' + (song.key ? song.key + ' → ' : '') + f.key);
        if (f.chords && f.chords !== song.chords.trim()) {
          const p = parseChords(f.chords), bars = p.reduce((n, r) => n + (r.t === 'bars' ? r.bars.length : 0), 0), sect = p.filter(r => r.t === 'sect').length;
          replaces = !!song.chords.trim();
          changes.push('Akkorde: ' + bars + ' Takte' + (sect ? ', ' + sect + ' Abschnitte' : '') + (replaces ? ' (ersetzt die vorhandenen)' : ''));
        }
        if (f.chordSource && f.chordSource !== song.chordSource) changes.push('Quelle: ' + (hostOf(f.chordSource) || f.chordSource));
        if (f.chordStatus && f.chordStatus !== song.chordStatus && (f.chords || song.chords.trim())) changes.push('Status: ' + (f.chordStatus === 'checked' ? 'geprüft' : 'ungeprüft'));
      }
      return { title, artist, how, songId:song ? song.id : null, songLabel:song ? song.title + (song.artist ? ' (' + song.artist + ')' : '') : '', f, changes, replaces, on:how === 'exact' && changes.length > 0 };
    });
  },
  async chordFile(file) {
    if (!file) return;
    try { Dialogs.chordImport(this.chordPlan(JSON.parse(await file.text()))); }
    catch (e) { toast('Akkord-Import fehlgeschlagen: ' + (e instanceof SyntaxError ? 'Die Datei ist kein gültiges JSON.' : e.message)); }
  },
  chordApply() {   // angehakte Zeilen der Vorschau übernehmen: nur Tonart, Akkorde, Quelle, Status
    const rows = Dialogs.plan || [], now = Date.now(); let n = 0;
    for (const cb of $$('#impList input:checked')) {
      const r = rows[Number(cb.dataset.i)], song = r && r.songId && Store.get(r.songId); if (!song) continue;
      for (const k of ['key', 'chords', 'chordSource', 'chordStatus']) if (hasOwn(r.f, k)) song[k] = r.f[k];
      song.updatedAt = now; n++;
    }
    Dialogs.plan = null; $('#dlg').close();
    if (n) { Store.save(); App.route(); }
    toast(n ? 'Akkorde für ' + n + (n === 1 ? ' Song' : ' Songs') + ' übernommen.' : 'Nichts übernommen.');
  },
  async restoreBackup(id, name) {
    if (!confirm('Stand aus «' + name + '» zurückholen? Die Songs der Sicherung ersetzen den heutigen Stand; Songs, die es nur jetzt gibt, bleiben.')) return;
    try {
      const inc = cleanData(await Cloud.readJson(id)), now = Date.now();
      if (!inc.songs.length) throw new Error('Die Sicherung enthält keine Songs.');
      const cur = new Map(Store.data.songs.map(s => [s.id, s]));
      for (const s of inc.songs) { const c = cur.get(s.id); s.stems = c ? c.stems : s.stems; if (c) { s.sheets = c.sheets; s.stageSheet = c.stageSheet; } if (!c || canon(Object.assign({}, c, { updatedAt:0 })) !== canon(Object.assign({}, s, { updatedAt:0 }))) s.updatedAt = now; else s.updatedAt = c.updatedAt; delete Store.data.deleted[s.id]; }
      inc.deleted = {}; inc.settingsAt = 0;
      const r = this.merge(inc);
      $('#dlg').close(); App.route(); toast('Wiederhergestellt: ' + (r.added + r.updated) + ' Songs zurückgeholt.');
    } catch (e) { toast('Wiederherstellen fehlgeschlagen: ' + explainError(e)); }
  }
};

/* ---------- Start (offline-first): erst lokale Daten anzeigen, dann Google/Drive im Hintergrund ---------- */
App.init();
// Service Worker: Programm-Dateien offline verfügbar machen (nur über https bzw. localhost möglich)
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(e => console.warn('Service Worker:', e));
  // Neue App-Version installiert: im Leerlauf sofort neu laden, sonst Hinweis zum Antippen
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloading) return;
    const ae = document.activeElement, idle = !$('#dlg').open && !App.stage && !Player.playing && !Bass.playing && !(ae && /^(TEXTAREA|INPUT)$/.test(ae.tagName));
    if (idle) { reloading = true; location.reload(); return; }
    const t = document.createElement('button'); t.className = 'primary'; t.textContent = '⟳ Neue Version – hier antippen zum Aktualisieren';
    t.style.cssText = 'position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);z-index:30;max-width:92vw;white-space:normal';
    t.addEventListener('click', () => { reloading = true; location.reload(); }); document.body.append(t);
  });
}
Cloud.boot();
</script>
