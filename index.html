/* =====================================================================

const SCHEMA = 3;

    if (typeof m.driveId === 'string' && /^[\w-]{5,200}$/.test(m.driveId)) stems[sl.id].driveId = m.driveId;
  }

    if (!m || typeof m !== 'object' || typeof m.id !== 'string' || !/^[\w-]{1,40}$/.test(m.id) || sheets.some(x => x.id === m.id)) continue;
    if (m.deleted) { sheets.push({ id:m.id, deleted:true, u:num(m.u) || 0 }); continue; }
    if (typeof m.name !== 'string') continue;
    const e = { id:m.id, name:str(m.name, 200), kind:hasOwn(SHEET_KINDS, m.kind) ? m.kind : 'other', file:str(m.file, 300), type:str(m.type, 100), size:num(m.size) || 0, u:num(m.u) || 0 };
    if (driveOk(m.driveId)) e.driveId = m.driveId;
    if (driveOk(m.annId)) e.annId = m.annId;
    if (num(m.au)) e.au = m.au;

    bpm: bpm != null && bpm >= 30 && bpm <= 260 ? Math.round(bpm) : null, key:str(r.key, 20),
    status: ['setlist', 'todo', 'demo'].includes(r.status) ? r.status : 'todo',
    notes:str(r.notes), uncertain:str(r.uncertain, 500), chords:str(r.chords), bassAbc:str(r.bassAbc, 60000),
    chordSource: (typeof r.chordSource === 'string' && r.chordSource.length <= 1000 && safeUrl(r.chordSource)) || '', chordStatus: r.chordStatus === 'checked' ? 'checked' : 'unchecked',
    sheets, stageSheet: sheets.some(x => x.id === r.stageSheet && !x.deleted) ? r.stageSheet : '',

    order: num(r.order), youtubeUrl:str(r.youtubeUrl, 500),
    spotify: r.spotify && /^[A-Za-z0-9]{22}$/.test(r.spotify.id) ? { id:r.spotify.id, name:str(r.spotify.name, 300), artists:str(r.spotify.artists, 300), auto:!!r.spotify.auto } : null,
    spTried: num(r.spTried) || 0,
    links: (Array.isArray(r.links) ? r.links : []).filter(l => l && safeUrl(l.url)).slice(0, 100).map(l => ({ id:str(l.id, 40) || uid(), label:str(l.label, 300), url:safeUrl(l.url), kind:hasOwn(LINK_KINDS, l.kind) ? l.kind : 'other' })),
    suggest, stems, mix,
    loop: { a: r.loop && num(r.loop.a), b: r.loop && num(r.loop.b) },
    isDemo: !!r.isDemo, updatedAt: num(r.updatedAt) || 0
  });
}

function cleanAnn(d) {

    if (!/^[1-9]\d{0,3}$/.test(k) || !Array.isArray(arr)) continue;
    const list = [];
    for (const o of arr.slice(0, 4000)) {
      if (!o || typeof o !== 'object' || !Array.isArray(o.p)) continue;
      const pts = o.p.slice(0, 6000).filter(q => Array.isArray(q) && fin(q[0]) && fin(q[1])).map(q => [q[0], q[1]]);
      if (!pts.length) continue;
      const st = { id:typeof o.id === 'string' && /^[\w-]{1,40}$/.test(o.id) ? o.id : uid(), p:pts, c:typeof o.c === 'string' && /^#[0-9a-f]{6}$/i.test(o.c) ? o.c : '#d32f2f', w:Math.min(0.08, Math.max(0.0005, fin(o.w) ? o.w : 0.004)) };

    const type = blob.type || 'application/octet-stream';
    if (blob.size > 4 * 1048576) {
      try {
        const init = await this.fetch(`${DRIVE_UPLOAD}?uploadType=resumable&fields=id`, { method:'POST', headers:{ 'Content-Type':'application/json; charset=UTF-8', 'X-Upload-Content-Type':type, 'X-Upload-Content-Length':String(blob.size) }, body:JSON.stringify(meta) }, interactive);
        const loc = init.headers.get('Location'); if (!loc) throw new Error('kein Upload-Link');
        return await (await this.fetch(loc, { method:'PUT', headers:{ 'Content-Type':type }, body:blob, timeout:600000 }, interactive)).json();
      } catch (e) { if (e.message === 'unauthorized' || e.message === 'offline' || blob.size > 5 * 1048576) throw e; console.warn('Resumable-Upload fehlgeschlagen, versuche Multipart', e); }

    return (await this.fetch(`${DRIVE_UPLOAD}?uploadType=multipart&fields=id`, { method:'POST', headers:{ 'Content-Type':'multipart/related; boundary=' + b }, body:new Blob([head, blob, enc.encode(`\r\n--${b}--`)]), timeout:300000 }, interactive)).json();

  /* --- Abgleich --- */
  markDirty() {   // lokale Änderung merken; kurz darauf mit Drive abgleichen (oder später, sobald online/angemeldet)

    UI.sync();
  },
  enqueue(fn) { const p = this.chain.then(fn, fn); this.chain = p.catch(() => {}); return p; },
  async syncAll(force) {

    this.lastRun = Date.now(); clearTimeout(this.timer);
    return this.enqueue(async () => {
      this.syncing++; UI.sync();

        await this.ensureFolder(false);
        await this.syncLibrary();
        if (await this.syncSheets()) await this.syncLibrary();   // neue Drive-Kennungen der Blätter gleich mit in library.json
        await this.flushTrash();
        await this.autoBackup().catch(e => console.warn('Sicherung', e));
        this.lastError = ''; LS.set('lastSync', Date.now()); return true;
      } catch (e) {

  },
  async syncLibrary() {

    let fid = LS.get('libId'), remote = null;
    if (fid) { try { remote = await this.readJson(fid); } catch (e) { if (e.status !== 404) throw e; fid = null; LS.del('libId'); } }
    if (!fid) { const f = await this.findByName('library.json', this.folderId); if (f) { fid = f.id; remote = await this.readJson(fid); } }
    if (fid && (!remote || !Array.isArray(remote.songs))) throw new Error('library.json in Drive ist nicht lesbar. Datei in Drive prüfen oder löschen – der lokale Stand wird dann neu hochgeladen.');
    // Ab hier bis Store.apply ohne «await»: zwischen Lesen und Übernehmen kann keine Eingabe verloren gehen.
    const local = Store.snapshot(), rem = remote ? cleanData(remote) : null;
    const merged = rem ? mergeData(local, rem) : local, mStr = canonData(merged);
    if (mStr !== canonData(local)) { Store.apply(merged); App.refresh(); }
    if (!rem || mStr !== canonData(rem)) { const out = await this.uploadJson('library.json', Store.payload(), fid, this.folderId); if (out && out.id) LS.set('libId', out.id); }
    else if (fid) LS.set('libId', fid);
    if (this.dirtySeq === seq) LS.del('dirty');
  },
  // Einmal pro Tag (gleicher Dateiname auf allen Geräten) eine JSON-Sicherung im Unterordner «Backups»; die letzten 14 bleiben.
  async listBackups() {
    const bid = await this.childFolder('Backups', 'backupFolder');
    const q = encodeURIComponent(`'${bid}' in parents and trashed=false and name contains 'library-'`);
    const files = (await (await this.fetch(`${DRIVE_FILES}?q=${q}&pageSize=200&fields=files(id,name,modifiedTime,size)`)).json()).files || [];
    return files.filter(f => /^library-\d{4}-\d{2}-\d{2}\.json$/.test(f.name)).sort((a, b) => b.name.localeCompare(a.name));
  },
  async autoBackup(force) {
    if (!this.canSync()) return false;
    const day = new Date().toLocaleDateString('sv-SE');
    if (!force && LS.get('lastbackup') === day) return false;
    const bid = await this.childFolder('Backups', 'backupFolder'), name = `library-${day}.json`;
    const ex = await this.findByName(name, bid);
    if (!ex || force) await this.uploadJson(name, Store.payload(), ex ? ex.id : null, bid);
    LS.set('lastbackup', day);
    for (const old of (await this.listBackups()).slice(BK_KEEP)) await this.trash(old.id).catch(() => {});
    return true;
  },
  trash(id) { return this.fetch(`${DRIVE_FILES}/${id}`, { method:'PATCH', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ trashed:true }) }); },
  queueTrash(id) { if (!id) return; let a = []; try { a = JSON.parse(LS.get('trash') || '[]'); } catch (e) {} a.push(id); LS.set('trash', JSON.stringify(a.slice(-200))); },
  async flushTrash() {   // in Drive gesicherte Stems, die lokal entfernt/ersetzt wurden, in den Drive-Papierkorb legen
    let a = []; try { a = JSON.parse(LS.get('trash') || '[]'); } catch (e) {}
    if (!Array.isArray(a) || !a.length) return;
    const rest = [];
    for (const id of a) { try { await this.trash(id); } catch (e) { if (e.message === 'offline' || e.message === 'unauthorized') rest.push(id); } }
    if (rest.length) LS.set('trash', JSON.stringify(rest)); else LS.del('trash');
  },

  /* --- Stems optional in Drive --- */
  async stemUpload(song, slot) {
    const rec = await IDB.get(stemKey(song.id, slot)); if (!rec || !rec.blob) throw new Error('Keine lokale Datei in diesem Slot.');
    await this.ensureFolder(true);
    const sf = await this.childFolder('Stems', 'stemsFolder', true);
    const out = await this.uploadBlob(rec.blob, { name:song.id + '__' + slot + '__' + rec.name, parents:[sf] });
    if (!out || !out.id) throw new Error('Upload ohne Antwort');
    const old = song.stems[slot] && song.stems[slot].driveId; if (old && old !== out.id) this.queueTrash(old);
    song.stems[slot] = { name:rec.name, size:rec.size, type:rec.type || '', u:rec.u || Date.now(), driveId:out.id };
    Store.touch(song);
  },
  async stemDownload(song, slot) {
    const meta = song.stems[slot]; if (!meta || !meta.driveId) throw new Error('Diese Datei ist nicht in Drive gesichert.');
    const res = await this.fetch(`${DRIVE_FILES}/${meta.driveId}?alt=media`, { timeout:600000 }, true);
    const blob = await res.blob();
    const rec = { blob:meta.type ? new Blob([blob], { type:meta.type }) : blob, name:meta.name, type:meta.type || blob.type, size:blob.size, u:meta.u || 0 };
    await IDB.put(stemKey(song.id, slot), rec);

  },
  /* --- Notenblätter: Datei und Freihand-Notizen (JSON daneben) im Unterordner «Notenblätter» ---
     Beim Abgleich werden lokale Blätter automatisch hochgeladen und fehlende geholt (damit sie am Auftritt offline da sind).
     Freihand-Notizen: pro Blatt gewinnt der neuere Stand (`au`) – gleiche Regel wie bei den Stems. */
  sheetName(song, m) { return song.id + '__' + m.id + '__' + (m.file || m.name || 'blatt'); },
  async sheetDownload(song, m, interactive = false) {
    const res = await this.fetch(`${DRIVE_FILES}/${m.driveId}?alt=media`, { timeout:600000 }, interactive);
    const blob = await res.blob(), type = m.type || blob.type;
    const rec = { blob:new Blob([blob], { type }), name:m.file || m.name, type, size:blob.size, u:m.u || 0 };
    await IDB.put(sheetKey(song.id, m.id), rec); Sheets.have.add(sheetKey(song.id, m.id));
    return rec;
  },
  async syncSheets() {
    let changed = false, seen = false, folder = null;
    const nf = async () => folder || (folder = await this.childFolder('Notenblätter', 'sheetsFolder'));
    const dirty = new Set(Sheets.dirtyList());
    for (const song of [...Store.data.songs]) for (const m of [...song.sheets]) {
      const bk = sheetKey(song.id, m.id), ak = annKey(song.id, m.id), key = song.id + '|' + m.id;
      // nach jedem «await» neu nachschlagen: ein Abgleich oder eine Eingabe kann den Eintrag inzwischen ersetzt haben
      const cur = () => { const s = Store.get(song.id), x = s && s.sheets.find(y => y.id === m.id); return x && !x.deleted ? [s, x] : null; };
      try {
        if (m.deleted) {   // auf einem anderen Gerät entfernt: lokale Kopie einmal pro Sitzung aufräumen
          if (!Sheets.gone.has(bk)) { Sheets.gone.add(bk); Sheets.have.delete(bk); await IDB.del(bk); await IDB.del(ak); Sheets.setDirty(key, false); }
          continue;
        }
        const rec = await IDB.get(bk);
        if (rec && rec.blob && !m.driveId) {
          const out = await this.uploadBlob(rec.blob, { name:this.sheetName(song, m), parents:[await nf()] }, false);
          if (!out || !out.id) throw new Error('Upload ohne Antwort');
          const c = cur();
          if (!c || (c[1].driveId && c[1].driveId !== out.id)) this.queueTrash(out.id);
          else { c[1].driveId = out.id; c[0].updatedAt = Date.now(); changed = true; }
        } else if (!rec && m.driveId) { await this.sheetDownload(song, m); seen = true; }
        const c = cur(); if (!c) continue;
        const x = c[1], arec = await IDB.get(ak), lu = (arec && arec.u) || 0;
        if (arec && arec.data && dirty.has(key) && lu > (x.au || 0)) {
          const name = song.id + '__' + m.id + '.annotations.json', body = { app:'band-trainer', kind:'annotations', v:1, u:lu, pages:arec.data.pages || {} };
          let out;
          try { out = await this.uploadJson(name, body, x.annId || null, await nf()); }
          catch (e) { if (e.status !== 404 || !x.annId) throw e; out = await this.uploadJson(name, body, null, await nf()); }   // Datei in Drive von Hand gelöscht → neu anlegen
          const c2 = cur();
          if (c2) { if (out && out.id) c2[1].annId = out.id; c2[1].au = lu; c2[0].updatedAt = Date.now(); changed = true; }
          const now = await IDB.get(ak); if (!now || (now.u || 0) <= lu) Sheets.setDirty(key, false);
        } else if (x.annId && (x.au || 0) > lu) {
          const data = cleanAnn(await this.readJson(x.annId));
          await IDB.put(ak, { data:{ v:1, pages:data.pages }, u:x.au }); Sheets.setDirty(key, false); Viewer.annChanged(song.id, m.id);
        } else if (dirty.has(key) && !arec) Sheets.setDirty(key, false);
      } catch (e) { if (e.message === 'offline' || e.message === 'unauthorized') throw e; console.warn('Notenblatt-Abgleich «' + (m.name || m.id) + '»', e); }
    }
    if (changed) { Store.persist(); LS.set('dirty', '1'); }
    if (changed || seen) UI.sheets();
    return changed;
  },
  folderHint() {   // einmaliger Hinweis nach dem ersten Verbinden
    if (LS.get('folderHint') || !this.folderId) return;
    LS.set('folderHint', '1'); Dialogs.folderHint();
  },
  status() {
    if (this.syncing > 0) return { t:'⟳ Abgleich …', c:'' , long:'Abgleich mit Drive läuft …' };
    if (!this.hadLogin()) return { t:'Nur lokal', c:'', long:'Nicht mit Google Drive verbunden – alles liegt nur auf diesem Gerät.' };
    const d = this.isDirty();
    if (!isOnline()) return { t:'Offline' + (d ? ' · offen' : ''), c:'warn', long:'Offline – Änderungen bleiben lokal gespeichert und werden später abgeglichen.' };
    if (!this.tokenValid()) return { t:'Anmelden', c:'warn', long:'Bei Google abgemeldet – Änderungen bleiben vorerst nur auf diesem Gerät.' };
    if (this.lastError) return { t:'⚠ Sync-Fehler', c:'err', long:'Abgleich fehlgeschlagen: ' + this.lastError };
    if (d) return { t:'● offen', c:'warn', long:'Änderungen sind noch nicht in Drive – werden gleich abgeglichen.' };
    return { t:'✓ Drive', c:'ok', long:'Drive ist auf dem neuesten Stand.' };
  },
  boot() {
    this.loadStoredToken(); UI.sync();
    document.addEventListener('pointerup', e => this.onPointerUp(e), true);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { if (this.canSync()) this.syncAll(false); else this.trySilentToken(); } });
    window.addEventListener('online', () => { UI.sync(); this.loadGsi().then(() => setTimeout(() => { if (this.canSync()) this.syncAll(true); else this.trySilentToken(); }, 800)); });
    window.addEventListener('offline', () => UI.sync());
    setInterval(() => this.trySilentToken(), 60000);
    if (this.hadLogin()) this.loadGsi().then(() => { if (this.canSync()) this.syncAll(true); else this.trySilentToken(); });
  }
};

/* ---------- Audio: gemeinsamer AudioContext, Metronom, Stem-Player ---------- */
const AC = {
  _ctx:null,
  get() {
    if (!this._ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; this._ctx = new C(); }
    if (this._ctx.state === 'suspended') this._ctx.resume().catch(() => {});
    return this._ctx;
  }
};
const Metro = {
  on:false, bpm:100, next:0, beat:0, timer:null,
  click(t, accent) {
    const c = AC.get(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.frequency.value = accent ? 1568 : 1047;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.45, t + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + 0.09);
  },
  start(bpm) {
    this.stop(); const c = AC.get(); if (!c) return;
    this.on = true; this.bpm = bpm; this.next = c.currentTime + 0.08; this.beat = 0;
    this.timer = setInterval(() => {
      while (this.next < c.currentTime + 0.15) { this.click(this.next, this.beat % 4 === 0); this.next += 60 / this.bpm; this.beat++; }
    }, 40);
  },
  stop() { clearInterval(this.timer); this.timer = null; this.on = false; },
  countIn(bpm, beats = 4) {
    const c = AC.get(); if (!c) return Promise.resolve();
    const t0 = c.currentTime + 0.1;
    for (let i = 0; i < beats; i++) this.click(t0 + i * 60 / bpm, i === 0);
    return new Promise(r => setTimeout(r, (0.1 + beats * 60 / bpm) * 1000));
  }
};

const Player = {
  song:null, tracks:{}, rate:1, playing:false, counting:false, timer:null, seeking:false, _token:0,
  async load(song) {
    this.unload(); this.song = song; this.rate = 1; const token = ++this._token;
    for (const s of SLOTS) {
      try {
        const rec = await IDB.get(stemKey(song.id, s.id));
        if (token !== this._token) return;
        const meta = song.stems[s.id];
        if (rec && rec.blob) {
          if (meta && meta.deleted && (meta.u || 0) > (rec.u || 0)) { IDB.del(stemKey(song.id, s.id)).catch(() => {}); continue; }   // auf einem anderen Gerät entfernt
          this.attach(s.id, rec);
          if (!meta || meta.deleted) song.stems[s.id] = { name:rec.name, size:rec.size, type:rec.type || '', u:rec.u || 0 };
        }   // Metadaten ohne lokale Datei bleiben stehen: Die Datei liegt auf einem anderen Gerät bzw. in Drive
      } catch (e) { console.warn('Stem nicht ladbar', e); }
    }
    UI.stems(); UI.transport();
  },
  attach(slot, rec) {
    this.detach(slot);
    const el = new Audio(); el.preload = 'auto';
    const url = URL.createObjectURL(rec.blob); el.src = url;
    el.preservesPitch = true; el.mozPreservesPitch = true; el.webkitPreservesPitch = true;   // Tempo ändern ohne Tonhöhenänderung
    el.playbackRate = this.rate;
    el.addEventListener('loadedmetadata', () => UI.transport());
    el.addEventListener('ended', () => { if (this.playing && this.master() && this.master().el === el) this.onEnded(); });
    el.addEventListener('error', () => toast('Datei kann nicht abgespielt werden: ' + (rec.name || slot)));
    this.tracks[slot] = { el, url, name:rec.name, size:rec.size, u:rec.u || 0, node:null, gain:null };
    this.applyMix();
  },
  detach(slot) {
    const t = this.tracks[slot]; if (!t) return;
    try { t.el.pause(); } catch {}
    try { t.node && t.node.disconnect(); t.gain && t.gain.disconnect(); } catch {}
    t.el.removeAttribute('src'); try { t.el.load(); } catch {}
    URL.revokeObjectURL(t.url); delete this.tracks[slot];
  },
  unload() { this.pause(); this._token++; Object.keys(this.tracks).forEach(s => this.detach(s)); this.song = null; },
  master() {   // längster geladener Stem gibt Position und Dauer vor
    let best = null;
    for (const t of Object.values(this.tracks)) { const d = isFinite(t.el.duration) ? t.el.duration : 0; if (!best || d > best.d) best = { t, d }; }
    return best && best.t;
  },
  time() { const m = this.master(); return m ? m.el.currentTime : 0; },
  duration() { const m = this.master(); return m && isFinite(m.el.duration) ? m.el.duration : 0; },
  ensureGraph() {   // Lautstärke über GainNodes (auf iOS ist audio.volume nicht steuerbar)
    const c = AC.get(); if (!c) return;
    for (const t of Object.values(this.tracks)) {
      if (t.node) continue;
      try { t.node = c.createMediaElementSource(t.el); t.gain = c.createGain(); t.node.connect(t.gain).connect(c.destination); t.el.volume = 1; t.el.muted = false; }
      catch (e) { console.warn('WebAudio-Routing nicht möglich, nutze Element-Lautstärke', e); }
    }
    this.applyMix();
  },
  applyMix() {
    if (!this.song) return;
    for (const [slot, t] of Object.entries(this.tracks)) {
      const m = this.song.mix[slot] || { on:true, vol:1 }; const v = m.on ? m.vol : 0;
      if (t.gain) t.gain.gain.value = v; else { t.el.muted = !m.on; try { t.el.volume = m.vol; } catch {} }
    }
  },
  async play() {
    const m = this.master();
    if (!m) { toast('Noch keine Audiodatei geladen – Tab «Audio».'); return; }
    if (this.playing || this.counting) return;
    this.ensureGraph();
    if (Store.data.settings.countIn) {
      if (this.song.bpm) { this.counting = true; this._abortCount = false; UI.playBtn(); await Metro.countIn(this.song.bpm * this.rate); this.counting = false; if (this._abortCount) { UI.playBtn(); return; } }
      else toast('Einzähler braucht eine BPM-Angabe beim Song.');
    }
    let t = m.el.currentTime; const lp = this.song.loop;
    if (lp.a != null && lp.b != null && (t < lp.a || t >= lp.b)) t = lp.a;
    if (this.duration() && t >= this.duration() - 0.05) t = lp.a != null ? lp.a : 0;
    for (const tr of Object.values(this.tracks)) {
      tr.el.playbackRate = this.rate;
      try { tr.el.currentTime = Math.min(t, isFinite(tr.el.duration) ? tr.el.duration : t); } catch {}
      tr.el.play().catch(e => console.warn('play()', e));
    }
    this.playing = true; clearInterval(this.timer); this.timer = setInterval(() => this.tick(), 60); UI.playBtn();
  },
  pause() {
    if (this.counting) this._abortCount = true;
    for (const tr of Object.values(this.tracks)) { try { tr.el.pause(); } catch {} }
    this.playing = false; clearInterval(this.timer); this.timer = null; UI.playBtn();
  },
  toggle() { (this.playing || this.counting) ? this.pause() : this.play(); },
  seek(t) {
    t = Math.max(0, Math.min(t, this.duration() || 0));
    for (const tr of Object.values(this.tracks)) { try { tr.el.currentTime = Math.min(t, isFinite(tr.el.duration) ? tr.el.duration : t); } catch {} }
    UI.time();
  },
  setRate(r) { this.rate = r; for (const tr of Object.values(this.tracks)) tr.el.playbackRate = r; if (Metro.on && this.song && this.song.bpm) Metro.bpm = this.song.bpm * r; },
  tick() {
    const m = this.master(); if (!m) return;
    const t = m.el.currentTime, lp = this.song.loop;
    if (lp.b != null && t >= lp.b) { this.seek(lp.a != null ? lp.a : 0); return; }
    for (const tr of Object.values(this.tracks)) {   // Stems zusammenhalten
      if (tr === m || tr.el.ended) continue;
      if (Math.abs(tr.el.currentTime - t) > 0.08 && t < (tr.el.duration || Infinity)) { try { tr.el.currentTime = t; } catch {} }
    }
    UI.time();
  },
  onEnded() { const lp = this.song.loop; if (lp.a != null && lp.b == null) { this.seek(lp.a); for (const tr of Object.values(this.tracks)) tr.el.play().catch(() => {}); } else this.pause(); }
};

    d.innerHTML = `<h2>Ordner in Google Drive</h2>
      <p>Die App hat in deinem Drive den Ordner <b>«${esc(CONFIG.FOLDER_NAME)}»</b> eingerichtet. Darin liegen <code>library.json</code> (Songs und Einstellungen) sowie die Unterordner «Stems», «Backups» (tägliche Sicherung, die letzten ${BK_KEEP} bleiben) und – sobald du Notenblätter ablegst – «Notenblätter».</p>
      <p>Du darfst den Ordner in Drive verschieben, zum Beispiel nach <b>«04_Band»</b> – die App findet ihn weiterhin, weil sie ihn selbst erstellt hat und sich seine Kennung nicht ändert. Bitte nicht umbenennen und die Dateien darin nicht von Hand bearbeiten.</p>
      <div class="actions"><button data-act="close" class="primary">Verstanden</button></div>`;
    if (!d.open) d.showModal();
  },
  async backups() {
    const d = $('#dlg');
    d.innerHTML = '<h2>Sicherungen in Drive</h2><p class="small muted" id="bkState">Lade Liste …</p><div class="scroll" id="bkList"></div><div class="actions"><button data-act="menu">Zurück</button><button data-act="close" class="primary">Schliessen</button></div>';
    try {
      const list = await Cloud.listBackups();
      if (!$('#bkList')) return;
      $('#bkState').textContent = list.length ? 'Wiederherstellen holt den Stand der Sicherung zurück (auch Gelöschtes). Songs, die es nur jetzt gibt, bleiben erhalten.' : 'Noch keine Sicherung vorhanden.';
      $('#bkList').innerHTML = list.map(f => `<div class="link"><div class="grow"><b>${esc(f.name.slice(8, 18).split('-').reverse().join('.'))}</b></div><button data-act="restore" data-id="${esc(f.id)}" data-name="${esc(f.name)}">Wiederherstellen</button></div>`).join('');
    } catch (e) { if ($('#bkState')) $('#bkState').textContent = 'Sicherungen nicht erreichbar: ' + explainError(e); }
  }
};

/* ---------- Import / Export / Wiederherstellen ---------- */
const IO = {
  exportJson() {
    const a = document.createElement('a'); const url = URL.createObjectURL(new Blob([JSON.stringify(Object.assign({ exportedAt:new Date().toISOString() }, Store.payload()), null, 2)], { type:'application/json' }));
    a.href = url; a.download = 'band-trainer-' + new Date().toISOString().slice(0, 10) + '.json'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000); toast('Export erstellt.');
  },
  merge(inc) {   // eingehenden Stand zusammenführen; gibt zurück, wie viele Songs neu/aktualisiert sind
    const before = new Map(Store.data.songs.map(s => [s.id, s.updatedAt || 0]));
    Store.apply(mergeData(Store.snapshot(), inc)); Store.fixOrder(true); Store.save();
    let added = 0, updated = 0;
    for (const s of Store.data.songs) { if (!before.has(s.id)) added++; else if ((s.updatedAt || 0) > before.get(s.id)) updated++; }
    return { added, updated };
  },
  async importJson(file) {
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!data || !Array.isArray(data.songs)) throw new Error('Keine Songliste gefunden.');
      // Akkord-Datei (Einträge ohne ID, aber mit Akkorden/Tonart) im falschen Menüpunkt gewählt → zur Akkord-Vorschau
      if (data.app !== 'band-trainer' && data.songs.length && !data.songs.some(x => x && typeof x.id === 'string')) { Dialogs.chordImport(this.chordPlan(data)); return; }
      const inc = cleanData(data); inc.settingsAt = 0;   // Einstellungen dieses Geräts bleiben
      const r = this.merge(inc);
      $('#dlg').close(); App.route(); toast('Import: ' + r.added + ' neu, ' + r.updated + ' aktualisiert.');
    } catch (e) { toast('Import fehlgeschlagen: ' + e.message); }
  },
  /* Akkord-Import: Datei {songs:[{title, artist, key, chords, chordSource, chordStatus}]} den vorhandenen Songs zuordnen.
     Zuordnung über Titel + Interpret (unscharf, siehe normName/artistMatch). Gibt die Vorschau-Zeilen zurück; geändert wird noch nichts. */
  chordPlan(data) {
    if (!data || !Array.isArray(data.songs)) throw new Error('Keine Songliste gefunden (erwartet: {"songs":[…]}).');
    const str = (v, max) => typeof v === 'string' ? v.slice(0, max).trim() : '';
    const songs = Store.data.songs.filter(s => !s.isDemo);
    return data.songs.slice(0, 500).filter(e => e && typeof e === 'object' && typeof e.title === 'string' && e.title.trim()).map(e => {
      const title = str(e.title, 300), artist = str(e.artist, 300), tk = normName(title);
      const cand = tk ? songs.filter(s => normName(s.title) === tk) : [], strong = cand.filter(s => artistMatch(s.artist, artist) !== false);
      let song = null, how = 'none';
      if (strong.length === 1) { song = strong[0]; how = 'exact'; }
      else if (strong.length > 1 || cand.length > 1) how = 'multi';
      else if (cand.length === 1) { song = cand[0]; how = 'title'; }
      const f = {}, key = str(e.key, 20), src = typeof e.chordSource === 'string' && e.chordSource.length <= 1000 ? safeUrl(e.chordSource) : null;
      const chords = (Array.isArray(e.chords) ? e.chords.filter(x => typeof x === 'string').join('\n') : typeof e.chords === 'string' ? e.chords : '').replace(/\r\n?/g, '\n').slice(0, 20000).trim();
      if (key) f.key = key;
      if (chords) f.chords = chords;
      if (src) f.chordSource = src;
      if (e.chordStatus != null && e.chordStatus !== '') f.chordStatus = e.chordStatus === true || /^(checked|gepr(ü|ue)ft|verified|ok)$/i.test(String(e.chordStatus).trim()) ? 'checked' : 'unchecked';
      else if (chords) f.chordStatus = 'unchecked';   // neue Akkorde ohne Angabe gelten als ungeprüft
      const changes = []; let replaces = false;
      if (song) {
        if (f.key && f.key !== song.key) changes.push('Tonart: ' + (song.key ? song.key + ' → ' : '') + f.key);
        if (f.chords && f.chords !== song.chords.trim()) {
          const p = parseChords(f.chords), bars = p.reduce((n, r) => n + (r.t === 'bars' ? r.bars.length : 0), 0), sect = p.filter(r => r.t === 'sect').length;
          replaces = !!song.chords.trim();
          changes.push('Akkorde: ' + bars + ' Takte' + (sect ? ', ' + sect + ' Abschnitte' : '') + (replaces ? ' (ersetzt die vorhandenen)' : ''));
        }
        if (f.chordSource && f.chordSource !== song.chordSource) changes.push('Quelle: ' + (hostOf(f.chordSource) || f.chordSource));
        if (f.chordStatus && f.chordStatus !== song.chordStatus && (f.chords || song.chords.trim())) changes.push('Status: ' + (f.chordStatus === 'checked' ? 'geprüft' : 'ungeprüft'));
      }
      return { title, artist, how, songId:song ? song.id : null, songLabel:song ? song.title + (song.artist ? ' (' + song.artist + ')' : '') : '', f, changes, replaces, on:how === 'exact' && changes.length > 0 };
    });
  },
  async chordFile(file) {
    if (!file) return;
    try { Dialogs.chordImport(this.chordPlan(JSON.parse(await file.text()))); }
    catch (e) { toast('Akkord-Import fehlgeschlagen: ' + (e instanceof SyntaxError ? 'Die Datei ist kein gültiges JSON.' : e.message)); }
  },
  chordApply() {   // angehakte Zeilen der Vorschau übernehmen: nur Tonart, Akkorde, Quelle, Status
    const rows = Dialogs.plan || [], now = Date.now(); let n = 0;
    for (const cb of $$('#impList input:checked')) {
      const r = rows[Number(cb.dataset.i)], song = r && r.songId && Store.get(r.songId); if (!song) continue;
      for (const k of ['key', 'chords', 'chordSource', 'chordStatus']) if (hasOwn(r.f, k)) song[k] = r.f[k];
      song.updatedAt = now; n++;
    }
    Dialogs.plan = null; $('#dlg').close();
    if (n) { Store.save(); App.route(); }
    toast(n ? 'Akkorde für ' + n + (n === 1 ? ' Song' : ' Songs') + ' übernommen.' : 'Nichts übernommen.');
  },
  async restoreBackup(id, name) {
    if (!confirm('Stand aus «' + name + '» zurückholen? Die Songs der Sicherung ersetzen den heutigen Stand; Songs, die es nur jetzt gibt, bleiben.')) return;
    try {
      const inc = cleanData(await Cloud.readJson(id)), now = Date.now();
      if (!inc.songs.length) throw new Error('Die Sicherung enthält keine Songs.');
      const cur = new Map(Store.data.songs.map(s => [s.id, s]));
      for (const s of inc.songs) { const c = cur.get(s.id); s.stems = c ? c.stems : s.stems; if (c) { s.sheets = c.sheets; s.stageSheet = c.stageSheet; } if (!c || canon(Object.assign({}, c, { updatedAt:0 })) !== canon(Object.assign({}, s, { updatedAt:0 }))) s.updatedAt = now; else s.updatedAt = c.updatedAt; delete Store.data.deleted[s.id]; }
      inc.deleted = {}; inc.settingsAt = 0;
      const r = this.merge(inc);
      $('#dlg').close(); App.route(); toast('Wiederhergestellt: ' + (r.added + r.updated) + ' Songs zurückgeholt.');
    } catch (e) { toast('Wiederherstellen fehlgeschlagen: ' + explainError(e)); }
  }
};

/* ---------- Start (offline-first): erst lokale Daten anzeigen, dann Google/Drive im Hintergrund ---------- */
App.init();
// Service Worker: Programm-Dateien offline verfügbar machen (nur über https bzw. localhost möglich)
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(e => console.warn('Service Worker:', e));
  // Neue App-Version installiert: im Leerlauf sofort neu laden, sonst Hinweis zum Antippen
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloading) return;
    const ae = document.activeElement, idle = !$('#dlg').open && !App.stage && !Player.playing && !Bass.playing && !(ae && /^(TEXTAREA|INPUT)$/.test(ae.tagName));
    if (idle) { reloading = true; location.reload(); return; }
    const t = document.createElement('button'); t.className = 'primary'; t.textContent = '⟳ Neue Version – hier antippen zum Aktualisieren';
    t.style.cssText = 'position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);z-index:30;max-width:92vw;white-space:normal';
    t.addEventListener('click', () => { reloading = true; location.reload(); }); document.body.append(t);
  });
}
Cloud.boot();
</script>
