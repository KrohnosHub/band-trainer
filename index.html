.stem{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;padding:12px 0;border-top:1px solid var(--border)}

.loopinfo{font-size:.8rem;color:var(--muted);text-align:center;margin-top:4px;min-height:1.1em}

.fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}

  async readJson(id) { return (await this.fetch(`${DRIVE_FILES}/${id}?alt=media`)).json(); },
  async uploadJson(name, obj, existingId, parentId) {

  /* --- Abgleich --- */

  /* --- Stems optional in Drive --- */

/* ---------- Audio: gemeinsamer AudioContext, Metronom, Stem-Player ---------- */
const AC = {
  _ctx:null,
  get() {
    if (!this._ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; this._ctx = new C(); }
    if (this._ctx.state === 'suspended') this._ctx.resume().catch(() => {});
    return this._ctx;
  }
};
const Metro = {
  on:false, bpm:100, next:0, beat:0, timer:null,
  click(t, accent) {
    const c = AC.get(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.frequency.value = accent ? 1568 : 1047;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.45, t + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + 0.09);
  },
  start(bpm) {
    this.stop(); const c = AC.get(); if (!c) return;
    this.on = true; this.bpm = bpm; this.next = c.currentTime + 0.08; this.beat = 0;
    this.timer = setInterval(() => {
      while (this.next < c.currentTime + 0.15) { this.click(this.next, this.beat % 4 === 0); this.next += 60 / this.bpm; this.beat++; }
    }, 40);
  },
  stop() { clearInterval(this.timer); this.timer = null; this.on = false; },
  countIn(bpm, beats = 4) {
    const c = AC.get(); if (!c) return Promise.resolve();
    const t0 = c.currentTime + 0.1;
    for (let i = 0; i < beats; i++) this.click(t0 + i * 60 / bpm, i === 0);
    return new Promise(r => setTimeout(r, (0.1 + beats * 60 / bpm) * 1000));
  }
};

const Player = {
  song:null, tracks:{}, rate:1, playing:false, counting:false, timer:null, seeking:false, _token:0,
  async load(song) {
    this.unload(); this.song = song; this.rate = 1; const token = ++this._token;
    for (const s of SLOTS) {
      try {
        const rec = await IDB.get(stemKey(song.id, s.id));
        if (token !== this._token) return;
        const meta = song.stems[s.id];
        if (rec && rec.blob) {
          if (meta && meta.deleted && (meta.u || 0) > (rec.u || 0)) { IDB.del(stemKey(song.id, s.id)).catch(() => {}); continue; }   // auf einem anderen Gerät entfernt
          this.attach(s.id, rec);
          if (!meta || meta.deleted) song.stems[s.id] = { name:rec.name, size:rec.size, type:rec.type || '', u:rec.u || 0 };
        }   // Metadaten ohne lokale Datei bleiben stehen: Die Datei liegt auf einem anderen Gerät bzw. in Drive
      } catch (e) { console.warn('Stem nicht ladbar', e); }
    }
    UI.stems(); UI.transport();
  },
  attach(slot, rec) {
    this.detach(slot);
    const el = new Audio(); el.preload = 'auto';
    const url = URL.createObjectURL(rec.blob); el.src = url;
    el.preservesPitch = true; el.mozPreservesPitch = true; el.webkitPreservesPitch = true;   // Tempo ändern ohne Tonhöhenänderung
    el.playbackRate = this.rate;
    el.addEventListener('loadedmetadata', () => UI.transport());
    el.addEventListener('ended', () => { if (this.playing && this.master() && this.master().el === el) this.onEnded(); });
    el.addEventListener('error', () => toast('Datei kann nicht abgespielt werden: ' + (rec.name || slot)));
    this.tracks[slot] = { el, url, name:rec.name, size:rec.size, u:rec.u || 0, node:null, gain:null };
    this.applyMix();
  },
  detach(slot) {
    const t = this.tracks[slot]; if (!t) return;
    try { t.el.pause(); } catch {}
    try { t.node && t.node.disconnect(); t.gain && t.gain.disconnect(); } catch {}
    t.el.removeAttribute('src'); try { t.el.load(); } catch {}
    URL.revokeObjectURL(t.url); delete this.tracks[slot];
  },
  unload() { this.pause(); this._token++; Object.keys(this.tracks).forEach(s => this.detach(s)); this.song = null; },
  master() {   // längster geladener Stem gibt Position und Dauer vor
    let best = null;
    for (const t of Object.values(this.tracks)) { const d = isFinite(t.el.duration) ? t.el.duration : 0; if (!best || d > best.d) best = { t, d }; }
    return best && best.t;
  },
  time() { const m = this.master(); return m ? m.el.currentTime : 0; },
  duration() { const m = this.master(); return m && isFinite(m.el.duration) ? m.el.duration : 0; },
  ensureGraph() {   // Lautstärke über GainNodes (auf iOS ist audio.volume nicht steuerbar)

  },
  applyMix() {

    }
  },
  async play() {
    const m = this.master();
    if (!m) { toast('Noch keine Audiodatei geladen – Tab «Audio».'); return; }
    if (this.playing || this.counting) return;
    this.ensureGraph();
    if (Store.data.settings.countIn) {
      if (this.song.bpm) { this.counting = true; this._abortCount = false; UI.playBtn(); await Metro.countIn(this.song.bpm * this.rate); this.counting = false; if (this._abortCount) { UI.playBtn(); return; } }

  pause() {

  },
  toggle() { (this.playing || this.counting) ? this.pause() : this.play(); },
  seek(t) {

  setRate(r) { this.rate = r; for (const tr of Object.values(this.tracks)) tr.el.playbackRate = r; if (Metro.on && this.song && this.song.bpm) Metro.bpm = this.song.bpm * r; },

};

/* ---------- Bassline: ABC-Rendering und Wiedergabe ---------- */
const Bass = {

  async play() {

      const synth = new ABCJS.synth.CreateSynth();

        ta.value = ['X:1', 'T:' + song.title + ' - Bass', 'M:4/4', 'L:1/8', 'Q:1/4=' + (song.bpm || 100), 'K:C clef=bass', '% Tonart in der Zeile K: anpassen, dann Takte eintragen:', 'z8 | z8 | z8 | z8 |'].join('\n');
        song.bassAbc = ta.value; Store.touch(song); Bass.render(song); break;
      }
      // Links & Vorschläge
      case 'linkAdd': {
        const url = safeUrl($('#lnUrl').value); if (!url) { toast('Bitte eine gültige URL (https://…) einfügen.'); break; }
        const kind = $('#lnKind').value; song.links.push({ id:uid(), label:$('#lnLabel').value.trim() || LINK_KINDS[kind], url, kind });
        $('#lnUrl').value = ''; $('#lnLabel').value = ''; Store.touch(song); UI.links(); break;
      }
      case 'linkDel': song.links = song.links.filter(l => l.id !== el.dataset.id); Store.touch(song); UI.links(); break;
      case 'embed': this.embedUrl = el.dataset.url; UI.links(); $('#ytBox').scrollIntoView({ behavior:'smooth', block:'center' }); break;
      case 'sugAccept': Suggest.accept(song, el.dataset.vid); UI.links(); UI.suggest(); toast('Unter «Meine Links» abgelegt.'); break;
      case 'sugDismiss': Suggest.dismiss(song, el.dataset.vid); UI.suggest(); break;
      case 'sugRun': Suggest.run(song, true); break;
    }

  trChanged(song) { UI.header(); UI.chords(); UI.info(); if (!Bass.playing) Bass.render(song); },
  async stemCloud(song, slot, dir) {
    const k = song.id + ':' + slot; if (this.stemBusy[k]) return;
    if (!isOnline()) { toast('Offline – das geht erst mit Internet.'); return; }
    if (!Cloud.tokenClient) await Cloud.loadGsi();
    this.stemBusy[k] = dir; UI.stems();
    try {
      if (dir === 'up') { await Cloud.stemUpload(song, slot); toast('In Drive gesichert.'); }
      else { const rec = await Cloud.stemDownload(song, slot); if (this.songId === song.id) { const was = Player.playing; if (was) Player.pause(); Player.attach(slot, rec); } toast('Aus Drive geladen: ' + rec.name); }
    } catch (e) { console.error(e); toast((dir === 'up' ? 'Sichern' : 'Laden') + ' fehlgeschlagen: ' + explainError(e)); }
    finally { delete this.stemBusy[k]; UI.stems(); UI.transport(); UI.sync(); }
  },
  onInput(e) {
    const t = e.target, song = this.current();
    if (t.id === 'q') { this.query = t.value; UI.listItems(); return; }
    if (!song || this.stage) return;
    const edit = () => { song.updatedAt = Date.now(); saveSoon(song); };
    if (t.id === 'seek') { Player.seeking = true; $('#tCur').textContent = fmt(Number(t.value)); }
    else if (t.id === 'rate') { Player.setRate(Number(t.value) / 100); UI.rate(); }
    else if (t.dataset.vol) { song.mix[t.dataset.vol].vol = Number(t.value) / 100; Player.applyMix(); edit(); }
    else if (t.id === 'chordsIn') { song.chords = t.value; UI.chords(); edit(); }
    else if (t.id === 'abcIn') { song.bassAbc = t.value; renderAbcSoon(song); edit(); }
    else if (t.id === 'notesIn') { song.notes = t.value; edit(); }
    else if (t.id === 'ytUrl') { song.youtubeUrl = t.value.trim(); this.embedUrl = null; edit(); embedSoon(); }
  },
  onChange(e) {
    const t = e.target, song = this.current();
    if (t.id === 'importFile') { IO.importJson(t.files[0]); t.value = ''; return; }
    if (!song || this.stage) return;
    if (t.id === 'seek') { Player.seek(Number(t.value)); Player.seeking = false; }
    else if (t.id === 'countIn') { Store.data.settings.countIn = t.checked; Store.saveSettings(); }
    else if (t.id === 'bassLoop') { Bass.loop = t.checked; }
    else if (t.type === 'file' && t.dataset.slot) { this.addStem(song, t.dataset.slot, t.files[0]); t.value = ''; }
  },
  async addStem(song, slot, file) {
    if (!file) return;
    if (!/^audio\//.test(file.type) && !/\.(mp3|m4a|aac|wav|flac|ogg|opus)$/i.test(file.name)) { toast('Bitte eine Audiodatei wählen.'); return; }
    try {
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
      const rec = { blob:file, name:file.name, type:file.type, size:file.size, u:Date.now() };
      await IDB.put(stemKey(song.id, slot), rec);
      const old = song.stems[slot]; if (old && old.driveId) Cloud.queueTrash(old.driveId);   // ersetzte Datei: alte Drive-Kopie entfernen
      song.stems[slot] = { name:file.name, size:file.size, type:file.type || '', u:rec.u }; song.mix[slot].on = true; Store.touch(song);
      const wasPlaying = Player.playing; if (wasPlaying) Player.pause();
      Player.attach(slot, rec); UI.stems(); UI.transport(); toast('Gespeichert: ' + file.name);
    } catch (e) { console.error(e); toast('Datei konnte nicht gespeichert werden (Speicherplatz?).'); }
  }
};

    const url = App.embedUrl || s.youtubeUrl, id = url ? ytId(url) : null;
    setHtml($('#ytBox'), id ? ytEmbed(id) : (url ? '<p class="small muted" style="margin-top:8px">Kein gültiger YouTube-Link erkannt.</p>' : '<p class="small muted" style="margin-top:8px">Füge den Link zu einer Aufnahme ein, an der du dich orientierst. Das Video wird direkt von YouTube geladen.</p>'));
    setHtml($('#linkList'), s.links.length ? s.links.map(l => { const u = safeUrl(l.url); return `<div class="link">
        <div class="grow"><div><b>${esc(l.label)}</b> <span class="badge">${esc(LINK_KINDS[l.kind] || '')}</span></div><div class="small muted">${esc(l.url)}</div></div>
        ${u && ytId(u) ? `<button data-act="embed" data-url="${esc(u)}">Hier</button>` : ''}
        ${u ? `<a class="btn" href="${esc(u)}" target="_blank" rel="noopener noreferrer">Öffnen</a>` : ''}
        <button class="icon ghost danger" data-act="linkDel" data-id="${esc(l.id)}" aria-label="Link entfernen">✕</button></div>`; }).join('')
      : '<p class="small muted">Noch keine Links. Vorschläge übernehmen oder gute Tutorials über die Suche unten finden und hier ablegen.</p>');
    setHtml($('#searchBox'), s.isDemo ? '<p class="small muted">Für den Demo-Song gibt es keine Suchlinks.</p>'
      : '<div class="searchgrid">' + searchLinks(s).map(([l, u]) => `<a class="btn" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(l)}</a>`).join('') + '</div><p class="small muted" style="margin-top:10px">Das sind automatisch erzeugte Suchanfragen, keine geprüften Empfehlungen. Akkorde und Tabs aus dem Netz sind oft fehlerhaft – mit der Aufnahme und der Band abgleichen.</p>');
  },
  suggest() {
    const s = App.current(), box = $('#sugBox'); if (!s || !box) return;
    let h;
    if (s.isDemo) h = '<p class="small muted">Für den Demo-Song gibt es keine Vorschläge.</p>';
    else if (!Suggest.available()) h = '<p class="small muted">Automatische Vorschläge sind nicht eingerichtet (kein YouTube-API-Schlüssel). Nutze die Suchlinks unten.</p>';
    else {
      const sg = s.suggest, items = sg ? sg.items : [], busy = Suggest.busy.has(s.id), err = Suggest.err[s.id];
      h = items.map(it => `<div class="sugg">
          ${it.thumb ? `<img src="${esc(it.thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ''}
          <div class="grow"><div class="ti">${esc(it.title)}</div>
            <div class="small muted">${esc(it.channel)}</div>
            <div><span class="badge sug">Vorschlag</span> <span class="badge">${esc(LINK_KINDS[it.kind])}</span></div>
            <div class="row"><button data-act="embed" data-url="https://www.youtube.com/watch?v=${esc(it.vid)}">Ansehen</button><button class="primary" data-act="sugAccept" data-vid="${esc(it.vid)}">Übernehmen</button><button class="ghost" data-act="sugDismiss" data-vid="${esc(it.vid)}">Verwerfen</button></div>
          </div></div>`).join('');
      if (busy) h += '<p class="small muted">Suche auf YouTube …</p>';
      else if (err) h += `<p class="small" style="color:var(--warn)">Vorschläge nicht verfügbar: ${esc(err)} Die Suchlinks unten funktionieren weiterhin.</p>`;
      else if (!sg || !sg.at) h += `<p class="small muted">${isOnline() ? 'Noch keine Vorschläge geladen.' : 'Offline – Vorschläge gibt es erst mit Internet.'}</p>`;
      else if (!items.length) h += '<p class="small muted">Keine (weiteren) Treffer. Nutze die Suchlinks unten oder suche neu.</p>';
      if (!busy) h += `<div class="row" style="margin-top:8px"><button data-act="sugRun">${sg && sg.at ? 'Neu suchen' : 'Vorschläge suchen'}</button></div>`;
      h += '<p class="small muted" style="margin-top:8px">Automatische YouTube-Treffer zu «Titel Interpret keyboard tutorial» bzw. «bass tutorial/cover» – ungeprüft. Übernimm nur, was zur Aufnahme und zur Band passt.</p>';
    }
    setHtml(box, h);
  },
  info() {
    const s = App.current(), el = $('#infoBox'); if (!s || !el) return;
    el.innerHTML = `<h3>Angaben</h3><table class="kv">
      <tr><td>Titel</td><td>${esc(s.title)}</td></tr><tr><td>Interpret</td><td>${esc(s.artist) || '–'}</td></tr>
      <tr><td>BPM</td><td>${s.bpm ? esc(s.bpm) : '– (noch nicht eingetragen)'}</td></tr><tr><td>Tonart</td><td>${esc(keyLabel(s)) || '– (noch nicht eingetragen)'}${s.transpose ? ' <span class="badge">' + esc(trLabel(s.transpose)) + '</span>' : ''}</td></tr>
      <tr><td>Status</td><td>${statusBadge(s)}</td></tr></table>
      <div class="row" style="margin-top:12px"><button data-act="edit">Angaben bearbeiten</button></div>`;
  },
  transport() {
    if (!$('#seek')) return; const d = Player.duration();
    $('#seek').max = d || 0; $('#tDur').textContent = d ? fmt(d) : '–:––';
    $('#seek').disabled = !d; this.time(); this.rate(); this.loop(); this.playBtn();
  },
  time() { const sk = $('#seek'); if (!sk || Player.seeking) return; const t = Player.time(); sk.value = t; $('#tCur').textContent = fmt(t); },
  rate() { const r = $('#rate'); if (!r) return; r.value = Math.round(Player.rate * 100); const s = App.current(); $('#rateOut').textContent = Math.round(Player.rate * 100) + ' %' + (s && s.bpm ? ' · ' + Math.round(s.bpm * Player.rate) + ' BPM' : ''); },
  loop() {
    const s = App.current(); if (!s || !$('#bA')) return; const { a, b } = s.loop;
    $('#bA').classList.toggle('on', a != null); $('#bB').classList.toggle('on', b != null);
    $('#loopInfo').textContent = a != null || b != null ? 'Loop: A ' + (a != null ? fmt(a) : '–') + '  →  B ' + (b != null ? fmt(b) : 'Ende') : '';
  },
  playBtn() { const b = $('#bPlay'); if (!b) return; const on = Player.playing || Player.counting; b.innerHTML = Player.counting ? 'Einzählen …' : (on ? ICON.pause : ICON.play); b.setAttribute('aria-label', on ? 'Pause' : 'Abspielen'); },
  bassBtn() { const b = $('#bBass'); if (!b) return; b.innerHTML = Bass.playing ? ICON.pause + ' Stopp' : ICON.play + ' Bass anhören'; b.classList.toggle('on', Bass.playing); },

  /* ----- Auftrittsmodus: Akkordraster im Vollbild, Wischen/Tasten zum nächsten Song ----- */
  stage() {
    const s = App.current(), l = App.stageList(), i = l.indexOf(s), prev = l[i - 1], next = l[i + 1];
    document.title = s.title + ' – Auftritt';
    $('#app').innerHTML = `<div class="stage" id="stage">
      <div class="shead">
        <button class="icon ghost" data-act="stageExit" aria-label="Auftrittsmodus beenden">✕</button>
        <div class="grow"><h1>${esc(s.title)}</h1></div>
        <span class="spos" id="stagePos">${i + 1} / ${l.length}</span>
        <button data-act="stageZoom" data-d="-0.15" aria-label="Akkorde kleiner">A−</button><button data-act="stageZoom" data-d="0.15" aria-label="Akkorde grösser">A+</button>
      </div>
      <div class="ssub">${esc([s.artist, s.bpm ? s.bpm + ' BPM' : '', s.key ? 'Tonart ' + keyLabel(s) : '', s.transpose ? trLabel(s.transpose) : ''].filter(Boolean).join(' · '))}</div>
      <div class="sbody">
        <div class="chordview" id="stageChords" style="--cs:${Number(Store.data.settings.stageSize) || 1}">${chordsHtml(s) || '<div class="muted small" style="font-family:system-ui,sans-serif">Für diesen Song sind noch keine Akkorde eingetragen.</div>'}</div>
        ${s.notes.trim() ? `<div class="snotes">${esc(s.notes)}</div>` : ''}
      </div>
      <div class="snav">
        <button data-act="stagePrev" ${prev ? '' : 'disabled'} aria-label="Vorheriger Song">‹ ${prev ? esc(prev.title) : 'Anfang'}</button>
        <button class="nx primary" data-act="stageNext" ${next ? '' : 'disabled'} aria-label="Nächster Song">${next ? esc(next.title) : 'Ende der Setlist'} ›</button>
      </div></div>`;
    const el = $('#stage'); let x0 = null, y0 = 0;
    el.addEventListener('touchstart', e => { if (e.touches.length === 1) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; } else x0 = null; }, { passive:true });
    el.addEventListener('touchend', e => {
      if (x0 == null) return; const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
      if (Math.abs(dx) > 60 && Math.abs(dx) > 2 * Math.abs(dy)) App.stageGo(dx < 0 ? 1 : -1);
    }, { passive:true });
  }
};
function statusBadge(s) {
  return s.status === 'setlist' ? '<span class="badge setlist">Setlist</span>' : s.status === 'demo' ? '<span class="badge demo">Demo</span>' : '<span class="badge todo">To Do</span>';
}

/* ---------- Dialoge ---------- */

  taps:[],

    const isNew = !song, s = song || newSong(), d = $('#dlg');
    d.innerHTML = `<form id="songForm" novalidate>
      <h2>${isNew ? 'Song hinzufügen' : 'Song bearbeiten'}</h2>
      <label class="f"><span>Titel *</span><input type="text" name="title" required value="${esc(s.title)}" autocomplete="off"></label>

      <div class="grid2">
        <label class="f"><span>BPM</span><div class="row nowrap"><input type="number" name="bpm" min="30" max="260" inputmode="numeric" value="${s.bpm ?? ''}"><button type="button" data-act="tap">Tap</button></div></label>
        <label class="f"><span>Tonart (Original)</span><input type="text" name="key" placeholder="z.B. A, Em" value="${esc(s.key)}" autocomplete="off" autocapitalize="off"></label>
      </div>
      <label class="f"><span>Status</span><select name="status">
        <option value="setlist" ${s.status==='setlist'?'selected':''}>Setlist</option><option value="todo" ${s.status==='todo'?'selected':''}>To Do</option>
        ${s.isDemo ? '<option value="demo" selected>Demo</option>' : ''}</select></label>
      <label class="f"><span>Hinweis «bitte prüfen» (leer = keine Unsicherheit)</span><input type="text" name="uncertain" value="${esc(s.uncertain)}" autocomplete="off"></label>
      <div class="actions">
        ${isNew ? '' : '<button type="button" class="danger ghost" data-act="delete" style="margin-right:auto">Löschen</button>'}
        <button type="button" data-act="close">Abbrechen</button><button type="submit" class="primary">Speichern</button>
      </div></form>`;
    $('#songForm').addEventListener('submit', e => {
      e.preventDefault(); const f = new FormData(e.target), title = String(f.get('title')).trim();
      if (!title) { toast('Bitte einen Titel eingeben.'); return; }
      const bpm = parseInt(f.get('bpm'), 10), status = ['setlist', 'todo', 'demo'].includes(f.get('status')) ? f.get('status') : 'todo';
      Object.assign(s, { title, artist:String(f.get('artist')).trim(), bpm:bpm >= 30 && bpm <= 260 ? bpm : null, key:String(f.get('key')).trim(), status, uncertain:String(f.get('uncertain')).trim() });
      if (status !== 'setlist') s.order = null;
      if (isNew) Store.data.songs.push(s);
      Store.fixOrder(true); Store.touch(s); d.close();
      if (isNew) location.hash = '#/song/' + encodeURIComponent(s.id); else { UI.header(); UI.info(); UI.links(); UI.suggest(); UI.rate(); UI.chords(); }
    });
    this.taps = []; if (!d.open) d.showModal();
  },
  tap() {
    const now = performance.now(); if (this.taps.length && now - this.taps[this.taps.length - 1] > 2000) this.taps = [];
    this.taps.push(now); if (this.taps.length > 8) this.taps.shift();
    if (this.taps.length >= 3) { const iv = (this.taps[this.taps.length - 1] - this.taps[0]) / (this.taps.length - 1); $('#songForm [name=bpm]').value = Math.round(60000 / iv); }
  },

    const d = $('#dlg'); let usage = '';
    Cloud.loadGsi();   // Google-Skript schon jetzt laden: das Anmelde-Fenster muss später direkt auf den Tipp folgen (Popup-Blocker)
    try { if (navigator.storage && navigator.storage.estimate) { const e = await navigator.storage.estimate(); usage = (e.usage / 1048576).toFixed(1) + ' MB belegt'; } } catch (e) {}
    const st = Cloud.status(), had = Cloud.hadLogin(), ok = Cloud.tokenValid(), last = Number(LS.get('lastSync')) || 0, id = String(CONFIG.CLIENT_ID);

    d.innerHTML = `<h2>Daten & Einstellungen</h2>
      <h3>Google Drive</h3>
      <div id="cloudBox">
        <p class="small" id="cloudState">${esc(st.long)}${last && had ? ' Letzter Abgleich: ' + esc(new Date(last).toLocaleString('de-CH', { dateStyle:'short', timeStyle:'short' })) + '.' : ''}</p>
        <div class="row" style="margin-bottom:8px">
          ${had && ok ? '<button class="primary" data-act="sync">Jetzt abgleichen</button><button data-act="backups">Sicherungen</button><button class="ghost" data-act="signOut">Abmelden</button>'
            : `<button class="primary" data-act="signIn">${had ? 'Wieder anmelden' : 'Mit Google Drive verbinden'}</button>${had ? '<button class="ghost" data-act="signOut">Trennen</button>' : ''}`}
        </div>
        <p class="small muted">Die App legt in deinem Drive den Ordner «${esc(CONFIG.FOLDER_NAME)}» an (Songs und Einstellungen in <code>library.json</code>, Unterordner «Stems» und «Backups») und sieht nur Dateien, die sie selbst erstellt hat. Ohne Anmeldung bleibt alles lokal nutzbar. ${had ? '<button class="ghost" data-act="folderInfo" style="min-height:32px;padding:0 8px">Hinweis zum Ordner</button>' : ''}</p>
      </div>
      <h3 style="margin-top:14px">Sichern & Übertragen</h3>
      <div class="row" style="margin-bottom:8px"><button data-act="export">Export (JSON)</button><button data-act="import">Import (JSON)</button></div>
      <p class="small muted">Export enthält Songs, Akkorde, Basslines, Links und Notizen – keine Audiodateien. Import führt zusammen: bei gleichem Song gewinnt der neuere Stand.</p>
      <h3 style="margin-top:14px">Hinweise</h3>
      <p class="small muted">Keine Songtexte oder vollständigen Transkriptionen Dritter veröffentlichen. Eigene Notizen für den Proberaum sind in Ordnung; Audiodateien bleiben auf dem Gerät bzw. in deinem privaten Drive.</p>
      <p class="small muted" id="verLine">Version ${APP_VERSION} · abcjs ${ABCJS_VERSION} · Offline-Speicher ${sw}${usage ? ' · ' + usage : ''}</p>
      <p class="small muted">Läuft auf ${esc(location.origin)} · Client-ID ${esc(id.length > 24 ? id.slice(0, 12) + '…' + id.slice(-27) : id)}</p>
      <div class="actions"><button data-act="reload">Neu laden / Update suchen</button><button data-act="close" class="primary">Schliessen</button></div>`;
    if (!d.open) d.showModal();
  },
  folderHint() {
    const d = $('#dlg');
    d.innerHTML = `<h2>Ordner in Google Drive</h2>

      <p>Du darfst den Ordner in Drive verschieben, zum Beispiel nach <b>«04_Band»</b> – die App findet ihn weiterhin, weil sie ihn selbst erstellt hat und sich seine Kennung nicht ändert. Bitte nicht umbenennen und die Dateien darin nicht von Hand bearbeiten.</p>
      <div class="actions"><button data-act="close" class="primary">Verstanden</button></div>`;
    if (!d.open) d.showModal();

  async backups() {
    const d = $('#dlg');
    d.innerHTML = '<h2>Sicherungen in Drive</h2><p class="small muted" id="bkState">Lade Liste …</p><div class="scroll" id="bkList"></div><div class="actions"><button data-act="menu">Zurück</button><button data-act="close" class="primary">Schliessen</button></div>';
    try {
      const list = await Cloud.listBackups();
      if (!$('#bkList')) return;
      $('#bkState').textContent = list.length ? 'Wiederherstellen holt den Stand der Sicherung zurück (auch Gelöschtes). Songs, die es nur jetzt gibt, bleiben erhalten.' : 'Noch keine Sicherung vorhanden.';
      $('#bkList').innerHTML = list.map(f => `<div class="link"><div class="grow"><b>${esc(f.name.slice(8, 18).split('-').reverse().join('.'))}</b></div><button data-act="restore" data-id="${esc(f.id)}" data-name="${esc(f.name)}">Wiederherstellen</button></div>`).join('');
    } catch (e) { if ($('#bkState')) $('#bkState').textContent = 'Sicherungen nicht erreichbar: ' + explainError(e); }
  }
};

/* ---------- Import / Export / Wiederherstellen ---------- */
const IO = {
  exportJson() {
    const a = document.createElement('a'); const url = URL.createObjectURL(new Blob([JSON.stringify(Object.assign({ exportedAt:new Date().toISOString() }, Store.payload()), null, 2)], { type:'application/json' }));
    a.href = url; a.download = 'band-trainer-' + new Date().toISOString().slice(0, 10) + '.json'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000); toast('Export erstellt.');
  },
  merge(inc) {   // eingehenden Stand zusammenführen; gibt zurück, wie viele Songs neu/aktualisiert sind
    const before = new Map(Store.data.songs.map(s => [s.id, s.updatedAt || 0]));
    Store.apply(mergeData(Store.snapshot(), inc)); Store.fixOrder(true); Store.save();
    let added = 0, updated = 0;
    for (const s of Store.data.songs) { if (!before.has(s.id)) added++; else if ((s.updatedAt || 0) > before.get(s.id)) updated++; }
    return { added, updated };
  },
  async importJson(file) {
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!data || !Array.isArray(data.songs)) throw new Error('Keine Songliste gefunden.');
      const inc = cleanData(data); inc.settingsAt = 0;   // Einstellungen dieses Geräts bleiben
      const r = this.merge(inc);
      $('#dlg').close(); App.route(); toast('Import: ' + r.added + ' neu, ' + r.updated + ' aktualisiert.');
    } catch (e) { toast('Import fehlgeschlagen: ' + e.message); }
  },
  async restoreBackup(id, name) {
    if (!confirm('Stand aus «' + name + '» zurückholen? Die Songs der Sicherung ersetzen den heutigen Stand; Songs, die es nur jetzt gibt, bleiben.')) return;
    try {
      const inc = cleanData(await Cloud.readJson(id)), now = Date.now();
      if (!inc.songs.length) throw new Error('Die Sicherung enthält keine Songs.');
      const cur = new Map(Store.data.songs.map(s => [s.id, s]));
      for (const s of inc.songs) { const c = cur.get(s.id); s.stems = c ? c.stems : s.stems; if (!c || canon(Object.assign({}, c, { updatedAt:0 })) !== canon(Object.assign({}, s, { updatedAt:0 }))) s.updatedAt = now; else s.updatedAt = c.updatedAt; delete Store.data.deleted[s.id]; }
      inc.deleted = {}; inc.settingsAt = 0;
      const r = this.merge(inc);
      $('#dlg').close(); App.route(); toast('Wiederhergestellt: ' + (r.added + r.updated) + ' Songs zurückgeholt.');
    } catch (e) { toast('Wiederherstellen fehlgeschlagen: ' + explainError(e)); }
  }
};

/* ---------- Start (offline-first): erst lokale Daten anzeigen, dann Google/Drive im Hintergrund ---------- */
App.init();
// Service Worker: Programm-Dateien offline verfügbar machen (nur über https bzw. localhost möglich)
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(e => console.warn('Service Worker:', e));
  // Neue App-Version installiert: im Leerlauf sofort neu laden, sonst Hinweis zum Antippen
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloading) return;
    const ae = document.activeElement, idle = !$('#dlg').open && !App.stage && !Player.playing && !Bass.playing && !(ae && /^(TEXTAREA|INPUT)$/.test(ae.tagName));
    if (idle) { reloading = true; location.reload(); return; }
    const t = document.createElement('button'); t.className = 'primary'; t.textContent = '⟳ Neue Version – hier antippen zum Aktualisieren';
    t.style.cssText = 'position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);z-index:30;max-width:92vw;white-space:normal';
    t.addEventListener('click', () => { reloading = true; location.reload(); }); document.body.append(t);
  });
}
Cloud.boot();
